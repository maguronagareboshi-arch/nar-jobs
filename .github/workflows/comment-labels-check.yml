# 2026-11-13 高知コメント分類の毎日分(cloud/comment_labels_daily.py)の試し。DB には書かない。
# - ドライラン(未分類の件数と見本 5 文)と、分類済みから無作為 40 文の付け直しで既存との一致率(--check 40)。
# - wip 枝への push でも走る(手で回す便は既定の枝に無いと押せないため)。分類の決まりは data/comment_taxonomy_v2.md(data/ は ignore= -f で入れた)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY / ANTHROPIC_API_KEY
name: comment-labels-check

on:
  workflow_dispatch:
  push:
    branches: ['wip/comment-labels-daily-*']
    paths: ['.github/workflows/comment-labels-check.yml']

concurrency:
  group: comment-labels-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q anthropic
      - name: dry run
        run: python cloud/comment_labels_daily.py --dry-run --limit 5
      - name: agreement check 40
        run: python cloud/comment_labels_daily.py --check 40
