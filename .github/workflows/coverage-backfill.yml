# §238c 網羅表(nar_meta 'coverage:v1' / 'coverage:v1:YYYY')の全期間の焼き直し(手押し)。
# 毎朝の便は直近 2 か月だけ数え直すので、初回と作り直しのときだけこれを回す。
# 実測(手元・2026-08 の 1 か月)= 通信 31 回・12 秒。2014-01〜当月 は約 150 か月。
# 入力 mode= dry(既定・書かずに枡の数と大きさを log に出す)/ apply(nar_meta へ書く)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: coverage-backfill
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'from (YYYY-MM)'
        required: true
        default: '2014-01'
      to:
        description: 'to (YYYY-MM)'
        required: true
        default: '2026-09'
      mode:
        description: 'dry (count only, no write) or apply (write)'
        required: true
        default: 'dry'
        type: choice
        options:
          - dry
          - apply
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - name: backfill coverage matrix
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
        run: |
          # 監査 11/3: 入力をシェルに直に埋め込まない= 環境変数で受けて日付の形だけ通す
          for v in "$IN_FROM" "$IN_TO"; do case "$v" in ''|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::日付は YYYY-MM-DD"; exit 1;; esac; done
          if [ "$MODE" = "apply" ]; then APPLY="--apply"; else APPLY=""; fi
          python cloud/coverage_matrix.py $APPLY --from "$IN_FROM" --to "$IN_TO"
