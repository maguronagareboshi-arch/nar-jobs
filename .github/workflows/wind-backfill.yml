# 風の過去分の取り込み: 気象庁「過去の気象データ」の 10 分値から、過去の開催日の風を nar_wind_obs へ足す(手動便)。
# 1 か月ずつ流す。heartbeat と /update-times には載せない(手動便のため)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY(既存。**新しい secret は作らない**)
name: wind-backfill

on:
  workflow_dispatch:
    inputs:
      month:
        description: '取り込む月(YYYY-MM)'
        required: true
        type: string
      venue:
        description: 'この場だけ(kochi や 高知・空なら全場)'
        default: ''
        type: string
      dry:
        description: '書かずに行数だけ'
        default: true
        type: boolean

concurrency:
  group: wind-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: backfill wind observations
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          MONTH: ${{ inputs.month }}
          VENUE: ${{ inputs.venue }}
          DRY: ${{ inputs.dry }}
        run: |
          set -o pipefail
          echo "$MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$' || { echo "month は YYYY-MM"; exit 1; }
          args=(--month "$MONTH")
          [ -n "$VENUE" ] && args+=(--venue "$VENUE")
          [ "$DRY" = "true" ] && args+=(--dry)
          python3 cloud/wind_backfill.py "${args[@]}"
