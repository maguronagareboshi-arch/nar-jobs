# 南関 AI v3 の買う層 v29(市場のずれ模型)の当日の便。各レースの締め切り 8 分前(発走 10 分前)に単勝の候補を決めて nar_meta に書く。
# 起動は pg_cron の dispatch(10:15 JST part=am / 15:50 JST part=pm・write=yes)。学習はしない。
# 土台 = 前日の nar-ai-v3 の成果物 v3-gap-base-DAY(V3_ASSET_KEY で暗号化)・模型 = リリース v3-gap-model-*(V3_GAP_KEY で暗号化)。
# ⛔本番に書くのは nar_meta(key = v3_gap:DAY:場:R)の REST upsert だけ。⛔公開ログに候補は出さない(件数だけ)。
name: v3-gap-live

on:
  workflow_dispatch:
    inputs:
      date:
        description: '日付(空= JST 今日)'
        required: false
        default: ''
      part:
        description: 'am(〜16:05)/ pm(〜21:15)'
        required: false
        default: 'am'
      write:
        description: 'nar_meta に書く(yes/no)'
        required: false
        default: 'no'
      model_tag:
        description: '模型のリリース tag'
        required: false
        default: 'v3-gap-model-20261001'

concurrency:
  group: v3-gap-live-${{ github.event.inputs.part }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q "pandas==2.2.3" "numpy==1.26.4" "lightgbm==4.7.0" requests

      - name: day
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          PART: ${{ github.event.inputs.part }}
        run: |
          if [ -n "$IN_DATE" ]; then DAY="$IN_DATE"; else DAY=$(TZ=Asia/Tokyo date +%F); fi
          echo "$DAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "date は YYYY-MM-DD で"; exit 1; }
          if [ "$PART" = "pm" ]; then UNTIL=21:15; else UNTIL=16:05; fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "until=$UNTIL" >> "$GITHUB_OUTPUT"; echo "day=$DAY until=$UNTIL"

      - name: base and model
        id: b
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          V3_GAP_KEY: ${{ secrets.V3_GAP_KEY }}
          V3_TRI_KEY: ${{ secrets.V3_TRI_KEY }}
          DAY: ${{ steps.d.outputs.day }}
          TAG: ${{ github.event.inputs.model_tag }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          mkdir -p in gapm
          # 2026-10-01: 土台が無くても終わらずに待つ(前日の便が遅れた・当日の朝に取り直した日も拾う)。
          #   南関の開催が無い日は待たない。締めの 10 分前まで来なければ赤(= 持ち主へ失敗のメール)。
          END=$(TZ=Asia/Tokyo date -d "$DAY ${{ steps.d.outputs.until }}" +%s)
          while :; do
            AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v3-gap-base-$DAY&per_page=10" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
            [ -n "$AID" ] && break
            N=$(python -X utf8 pipeline/ai/v3/v3_precheck.py "$DAY" --count || echo "?")
            if [ "$N" = "0" ]; then echo "今日は南関の開催なし = 何もしない"; echo "ok=no" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$(date +%s)" -ge $((END - 600)) ]; then
              echo "::error::⛔ $DAY は南関 ${N} R あるのに前日の土台(v3-gap-base-$DAY)が締めまで来なかった。nar-ai-v3 を確かめる"
              echo "ok=no" >> "$GITHUB_OUTPUT"; exit 1
            fi
            echo "土台がまだ無い(南関 ${N} R)= 5 分後に見直す $(TZ=Asia/Tokyo date +%H:%M)"
            sleep 300
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > in/base.zip
          unzip -q -o in/base.zip -d in
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v29_base.csv.enc -out in/v29_base.csv
          # 2026-10-12 決め 24: 並び読みの前日の材料(無ければ当日版は第12版のまま)
          if [ -f in/seq2.npz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/seq2.npz.enc -out in/seq2.npz || echo "並び読みの材料を開けない"
          else
            echo "並び読みの材料なし(第12版のまま)"
          fi
          V3_GAP_KEY=$(printf %s "$V3_GAP_KEY" | tr -d '\r\n'); export V3_GAP_KEY
          gh release download "${TAG:-v3-gap-model-20261001}" -p 'v3_gap_model.tar.gz.enc' -D in
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_GAP_KEY -in in/v3_gap_model.tar.gz.enc | tar -C gapm -xzf -
          # 2026-10-02: 当日版の印(発走 30 分前・当日の体重入り)の模型。無ければ当日版は出さない(10 分前の候補はそのまま)
          if gh release download v3-t11-day-20261012 -p 'v3_t11_day.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_GAP_KEY -in in/v3_t11_day.tar.gz.enc | tar -C gapm -xzf - || echo "当日版の模型を開けない"
          else
            echo "当日版の模型なし(当日版の印は出さない)"
          fi
          # 2026-10-02: 3 連単(d1b)・3 連複(c8)のずれ模型 = 記録だけ。無ければ記録しない(単勝の候補はそのまま)
          if gh release download v3-tri-model-20261002 -p 'v3_tri.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_GAP_KEY -in in/v3_tri.tar.gz.enc | tar -C gapm -xzf - || echo "3 連単・3 連複の模型を開けない"
          else
            echo "3 連単・3 連複の模型なし(記録しない)"
          fi
          # 2026-10-04: 3 連単を d4(毎年学び直し・2026 年用)に入れ替え(公開の 3 連単 丙)。専用の鍵 V3_TRI_KEY。
          #   開けたら上の d1b を上書きし tri_name.txt = d4-2026。開けなければ d1b のまま(v29_gap が d1b と記録)
          V3_TRI_KEY=$(printf %s "$V3_TRI_KEY" | tr -d '\r\n'); export V3_TRI_KEY
          if [ -n "$V3_TRI_KEY" ] && gh release download v3-tri-model-20261004 -p 'v3_tri_d4.tar.gz.enc' -D in; then
            mkdir -p in/tri4
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_TRI_KEY -in in/v3_tri_d4.tar.gz.enc | tar -C in/tri4 -xzf - && [ -s in/tri4/d1b_tri_model.txt ] && [ -s in/tri4/c8_trio_model.txt ]; then
              cp in/tri4/d1b_tri_model.txt in/tri4/c8_trio_model.txt gapm/ && printf d4-2026 > gapm/tri_name.txt && echo "3 連単 = d4-2026"
            else
              echo "::warning::3 連単 d4 の包みを開けない(d1b のまま)"
            fi
          else
            echo "3 連単 d4 の包みなし(d1b のまま)"
          fi
          # 2026-10-12 決め 24 → 2026-10-13 決め 25: 並び読みの重み(seq2_model.npz・seq2_prod.json・V3_ASSET_KEY)。無ければ当日版は第12版のまま
          # 2026-10-23 決め 51: 同じ形の重みを仕上げの段に 2018-06〜2022 年を足して学び直した物(v3-seq51-20261023)
          if gh release download v3-seq51-20261023 -p 'v3_seq2.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_seq2.tar.gz.enc | tar -C gapm -xzf - || echo "並び読みの模型を開けない"
          else
            echo "並び読みの模型なし(第12版のまま)"
          fi
          # 前の版(決め 24)の重み = 版の切り替えの日に前日の材料が前の版の形のとき使う(seq2_live.load が形で選ぶ)
          mkdir -p in/prev gapm/prev
          if gh release download v3-seq2-20261012 -p 'v3_seq2.tar.gz.enc' -D in/prev; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/prev/v3_seq2.tar.gz.enc | tar -C gapm/prev -xzf - || echo "前の版の並び読みの模型を開けない"
          fi
          # 2026-10-14 決め 30: 全馬の短評の層の模型(V3_ASSET_KEY)。無ければ当日版は短評の層を足さない
          mkdir -p gapm/tanpyo
          if gh release download v3-tanpyo-20261015 -p 'v3_tanpyo.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_tanpyo.tar.gz.enc | tar -C gapm/tanpyo -xzf - || echo "短評の層の模型を開けない"
          else
            echo "短評の層の模型なし(足さない)"
          fi
          # 2026-10-22 決め 49: 平らな模型 F3 の木(種 3 本 × 3 着内・1 着・V3_ASSET_KEY)。無ければ当日版は F3 を混ぜない
          mkdir -p gapm/f3
          if gh release download v3-f3-20261022 -p 'v3_f3.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_f3.tar.gz.enc | tar -C gapm/f3 -xzf - || echo "F3 の模型を開けない"
          else
            echo "F3 の模型なし(混ぜない)"
          fi
          # 2026-10-15 決め 38-1: 直前版の勝つ率で学んだ買いの模型(種 3 本・V3_ASSET_KEY)。無ければ全部 v31 で決める
          if gh release download v3-buy38-20261015 -p 'v3_buy38.tar.gz.enc' -D in; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_buy38.tar.gz.enc | tar -C gapm -xzf - || echo "買いの模型 決め38-1 を開けない(v31 のまま)"
          else
            echo "買いの模型 決め38-1 なし(v31 のまま)"
          fi
          ls gapm; wc -l in/v29_base.csv
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      # 2026-10-15 予想の学んだ定数・表(勝つ率の直し・談話の印・他場の曲線など)= 暗号化したリリース v3-consts-20261025(公開のコードに置かない)。
      #   取れない・開けない・中身が欠けている時は止める(黙って別の値で予想を出さない)。中身の確かめ = pipeline/ai/sealed.py check
      - name: download sealed constants
        id: sc
        if: steps.b.outputs.ok == 'yes'
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          : "${V3_ASSET_KEY:?secrets.V3_ASSET_KEY が無い}"
          mkdir -p in sealed_consts
          for i in 1 2 3; do
            gh release download v3-consts-20261025 -p 'v3_consts.tar.gz.enc' -D in --clobber && break
            [ "$i" = 3 ] && { echo "::error::⛔ 予想の定数(v3-consts-20261025)を 3 回取れなかった"; exit 1; }
            sleep 20
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_consts.tar.gz.enc | tar -C sealed_consts -xzf -
          rm -f in/v3_consts.tar.gz.enc
          V3_CONSTS="$PWD/sealed_consts" python -X utf8 pipeline/ai/sealed.py check
          echo "V3_CONSTS=$PWD/sealed_consts" >> "$GITHUB_ENV"

      - name: live
        if: steps.b.outputs.ok == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event.inputs.write }}
        run: |
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          python -X utf8 pipeline/ai/v3/v29_gap.py live "${{ steps.d.outputs.day }}" in/v29_base.csv gapm $W --until "${{ steps.d.outputs.until }}"
      # 2026-10-03 監査 A-2: heartbeat を書く(見張りの fail 検査に載る)
      - name: heartbeat ok
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py v3_gap_live ok
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py v3_gap_live fail 失敗
