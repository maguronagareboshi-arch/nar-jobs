# §238a 派生表 nar_run_facts の遡り(手動便)。1 か月 約 40 秒+upsert。
# §238e 入力 mode= dry(既定・書かずに本番との差を log に出す)/ apply(書く)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: run-facts-backfill
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'from (YYYY-MM-DD)'
        required: true
        default: '2025-09-01'
      to:
        description: 'to (YYYY-MM-DD)'
        required: true
        default: '2026-09-21'
      mode:
        description: 'dry (count only, no write) or apply (write)'
        required: true
        default: 'dry'
        type: choice
        options:
          - dry
          - apply
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - name: backfill nar_run_facts
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "apply" ]; then APPLY="--apply"; else APPLY=""; fi
          python cloud/run_facts.py $APPLY --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}"
