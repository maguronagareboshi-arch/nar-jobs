# 2026-11-09 厩舎の話(nar_kb_danwa)→ nar_danwa_note の埋め(cloud/danwa/danwa_para.py)。手で回すだけ。
#   tags_only=1 は言い換えをせず札だけ(過去 7.8 万件の札の埋め用・AI 不要)。0 は言い換えも(ANTHROPIC_API_KEY を使う)。
#   status=ok で原文が同じ行は飛ばす(手の言い換え hand-20261109 も上書きしない)。読みは月ごと・書きは 500 行ずつの upsert。
#   dry=1 は数えるだけ(書かない)。sunpyo=1/redo は寸評だけ(sunpyo.py・11/12)。tags_haiku=1 は札だけを Haiku で付け直す(11/12・para・status・model は触らない)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY / ANTHROPIC_API_KEY(tags_only=0 のとき)
name: danwa-para-backfill
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'はじめの日 YYYY-MM-DD'
        required: true
      to:
        description: 'おわりの日 YYYY-MM-DD'
        required: true
      tags_only:
        description: '1= 札だけ(言い換えをしない)・0= 言い換えも'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']
      dry:
        description: '1= 書かない(数えるだけ)・0= 書く'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']
      tags_haiku:
        description: '1= 札だけを Haiku で付け直す(para は触らない・tags_only/redo は使わない)・0= しない'
        required: true
        default: '0'
        type: choice
        options: ['1', '0']
      sunpyo:
        description: '寸評だけ作る(sunpyo.py・para は触らない)。1= sunpyo が空の行・redo= 全部作り直す・0= しない'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', 'redo']
      redo:
        description: '作り直す model の頭(, 区切り・空= しない)。例 claude-haiku-5-5,haiku-hand-。hand- は守る'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: danwa-para-${{ inputs.from }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q anthropic
      - name: unit tests
        run: |
          python cloud/danwa/test_danwa_para.py
          python cloud/danwa/test_sunpyo.py
      - name: danwa backfill
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          D_FROM: ${{ inputs.from }}
          D_TO: ${{ inputs.to }}
          TAGS_ONLY: ${{ inputs.tags_only }}
          DRY: ${{ inputs.dry }}
          REDO: ${{ inputs.redo }}
          TAGS_HAIKU: ${{ inputs.tags_haiku }}
          SUNPYO: ${{ inputs.sunpyo }}
        run: |
          for d in "$D_FROM" "$D_TO"; do
            echo "$d" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "日付は YYYY-MM-DD で"; exit 1; }
          done
          if [ "$SUNPYO" != "0" ]; then
            A="--from $D_FROM --to $D_TO"
            [ "$SUNPYO" = "redo" ] && A="$A --redo"
            [ "$DRY" = "1" ] && A="$A --dry-run"
            python cloud/danwa/sunpyo.py $A
            exit 0
          fi
          A="--from $D_FROM --to $D_TO"
          if [ "$TAGS_HAIKU" = "1" ]; then A="$A --tags-haiku"
          elif [ "$TAGS_ONLY" = "1" ]; then A="$A --tags-only"; fi
          [ "$DRY" = "1" ] && A="$A --dry-run"
          if [ -n "$REDO" ]; then
            echo "$REDO" | grep -Eq '^[a-z0-9.,-]+$' || { echo "redo は英数字と , . - だけ"; exit 1; }
            A="$A --redo $REDO"
          fi
          python cloud/danwa/danwa_para.py $A
