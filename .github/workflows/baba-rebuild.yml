# 馬場差の方式を変えたとき(例 2026-09-28 勝ち時計→1〜5着 T5)に 1 回だけ流す手動便。
#   1) baba.py --apply --rebuild-all(90 日の確定済みも組み直す)
#   2) baba_trend.py --calibrate(閾値表 pipeline/baba_trend_q.json を新しい d で作り直す)
#   3) q.json に差分があれば commit・push(rebase してから。失敗したら赤で止める)
#   4) baba_trend.py --apply(--today なし= 90 日ぜんぶ組み直し・新しい閾値表で言葉を付け直す)
#   5) baba_hist.py --apply --rebuild-all(持ちタイム表の全期間ファイルを 2014〜 で作り直す・10/25)
# ⛔2026-10-26 距離の直し(d1/g1 を足した)の切替でも 1 回流す= 確定済みの日にも d1/g1 を付ける
# ⛔nar-refresh と同じ concurrency group= 定時便と重ならない。nar-refresh.yml の権限は広げない(書き込みはこの便だけ)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: baba-rebuild
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nar-refresh
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt

      - name: baba diff rebuild all
        run: python cloud/baba.py --apply --rebuild-all

      - name: baba trend calibrate
        run: python cloud/baba_trend.py --calibrate

      - name: commit q json
        run: |
          set -e
          if [ -n "$(git status --porcelain pipeline/baba_trend_q.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/baba_trend_q.json
            git commit -m "baba_trend 閾値表を作り直し(馬場差の方式変更・$(TZ=Asia/Tokyo date +%F))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "閾値表に差分なし"
          fi

      - name: baba trend apply all days
        run: python cloud/baba_trend.py --apply

      # 2026-10-25 持ちタイム表の全期間ファイル(cond-stats/v1/baba-hist/)も同じ方式で全期間を作り直す
      - name: baba hist rebuild all
        run: python cloud/baba_hist.py --apply --rebuild-all
