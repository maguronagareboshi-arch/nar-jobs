# 研究用・1 回きり。(cloud/odds_win_vs_trifecta.py)= 締め切り 2 分前の単勝 vs 3連単を 9/8〜9/30 で集計し docs/odds-win-vs-trifecta/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。schedule なし。
name: odds-win-vs-trifecta
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odds-win-vs-trifecta
  cancel-in-progress: false
jobs:
  wintri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: odds win vs trifecta
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/odds_win_vs_trifecta.py
          if [ -n "$(git status --porcelain docs/odds-win-vs-trifecta)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/odds-win-vs-trifecta
            git commit -m "単勝vs3連単 締め切り前 研究集計 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "差分なし"
          fi
