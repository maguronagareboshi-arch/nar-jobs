# 研究用・1 回きり。締め切り前に見える票の動き(cloud/late_money_preclose.py)を 2026-09 で集計し docs/late-money-preclose/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。schedule なし。
name: late-money-preclose
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: late-money-preclose
  cancel-in-progress: false
jobs:
  preclose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: late money preclose
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/late_money_preclose.py
          if [ -n "$(git status --porcelain docs/late-money-preclose)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/late-money-preclose
            git commit -m "締め切り前の票の動き 研究集計 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "差分なし"
          fi
