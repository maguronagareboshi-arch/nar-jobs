# 研究用・1 回きり。(cloud/trifecta_surge_return.py)= 直前の伸びが大きい 3連単の組を買った回収を 9/8〜10/19 で数え docs/trifecta-surge-return/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。schedule なし。
name: trifecta-surge-return
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trifecta-surge-return
  cancel-in-progress: false
jobs:
  surge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: trifecta surge return
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/trifecta_surge_return.py
          if [ -n "$(git status --porcelain docs/trifecta-surge-return)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/trifecta-surge-return
            git commit -m "直前の伸び 3連単 回収 研究集計 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "差分なし"
          fi
