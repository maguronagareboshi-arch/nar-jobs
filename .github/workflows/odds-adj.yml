# §259 最終オッズの見込みの券種補正(§257)を月 1 回作り直す便。
# 目的: 基準日の前日までの 60 日で T ごとに係数を作り直し、採点(直近 14 日)で「今の係数」と「補正なし」の両方に勝った T があれば
#   nar_meta 'odds_forecast_adj' の一覧の末尾に 1 件足す(since= 基準日の翌日)。古い項目は消さない・書き換えない。
# 行・係数・採点は画面と同じ部品を本番から取る(https://yukochi.com/viewer-data/odds-forecast/odds-final.mjs と model.json)。
# 2026-11-04 定期実行を止めた(手動だけ)= 最終予測の模型を 28 特徴へ切り替え、補正は掛けなくなったため(馬単・3連単の売れ方は模型の材料に入っている)。
#   前の模型(18 特徴)に戻すときは schedule の cron '10 21 28-31 * *'(毎月 1 日 JST 06:10)を戻す。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: odds-adj
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'base date (YYYY-MM-DD / empty = JST today)'
        required: false
        default: ''
      dry_run:
        description: 'dry run (no write)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: odds-adj
  cancel-in-progress: false
jobs:
  adj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: odds adj
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DATE_IN: ${{ github.event.inputs.date }}
          DRY: ${{ github.event.inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          # 定時は UTC の月末日 21:10(= JST の 1 日 06:10)だけ走る。28〜31 日のうち、翌日が 1 日でない日は何もしない
          if [ "$EVENT" = "schedule" ] && [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then echo "JST 1 日ではない"; exit 0; fi
          set --
          if [ -n "$DATE_IN" ]; then set -- "$@" --date "$DATE_IN"; fi
          if [ "$DRY" = "true" ]; then set -- "$@" --dry-run; fi
          node cloud/odds_adj.mjs "$@"
          # 監査 A8(2026-09-24) 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
          if [ "$DRY" != "true" ]; then python3 cloud/beat.py odds_adj ok; fi

      # 監査 A8(2026-09-24) 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py odds_adj fail 失敗
