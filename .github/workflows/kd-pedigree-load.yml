# (2026-10-02) KDSCOPE の馬の台帳から作った血統の CSV(data/kd_pedigree/kd_pedigree.csv.gz)を
#   本番の nar_kd_pedigree に 1000 行ずつ upsert する(手動だけ・冪等)。表は pipeline/sql/nar_kd_pedigree_20261002.sql。
#   CSV の作り直しは手元の pipeline/kd_pedigree_export.py → commit → この便を手動で流す。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: kd-pedigree-load
on:
  workflow_dispatch:
concurrency:
  group: kd-pedigree-load
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: kd pedigree upsert
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python pipeline/kd_pedigree_load.py
