# 研究用・1 回きり。馬場差 projhalf の②を「安定して走る馬を物差しにする」形に変えた 4 通りを次走のテストで比べる
# (2026-11-04・cloud/research_baba_steady.py)。⛔読み取りだけ(REST の単純 select)。公開バケットにも DB にも書かない。結果は artifact。
name: research-baba-steady
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  steady:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 pandas==2.2.3
      - name: baba steady compare
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/research_baba_steady.py --out out/RESULT_baba_steady.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baba-steady
          path: out/
