# 競馬ブックにクラウドからログインできるかの試し(2026-09-29)。⛔手で回すだけ(cron なし)・本番 DB に書かない。
# secrets KEIBABOOK_LOGIN_ID / KEIBABOOK_PASSWORD を使う。台本 cloud/kb_login_test.py は値も頁の中身も表示しない。
name: kb-login-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q requests==2.34.2
      - name: login test
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_RELAY_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}  # 競馬ブックが海外を断る間の東京の中継(cloud/kb/kb_relay.py)
        run: python cloud/kb_login_test.py
