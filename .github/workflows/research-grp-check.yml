# 研究用・1 回きり(2026-11-04)。この日の時計の組の差・前半を本物で確かめる。
#   1) cloud/research_grp_check.py= 2026-11 月の組の表(全場)と記者選抜を分けた場合
#   2) baba.py の作り直しをドライランで(⛔--apply なし= DB に書かない)。時間と容量を測る
# ⛔読み取りだけ。枝 wip/dt-grp-20261104 を取り出して動かす。
name: research-grp-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wip/dt-grp-20261104
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - name: group table check
        run: python cloud/research_grp_check.py out/RESULT_grp_check.md
      - name: baba dry run rebuild all
        run: |
          /usr/bin/time -v python cloud/baba.py --rebuild-all --baseline projhalf 2>&1 | tee out/baba_dryrun.log
          python - <<'PY'
          import re, json
          s = open("out/baba_dryrun.log", encoding="utf-8").read()
          m = re.search(r"例 (\S+): (\{.*\})", s)
          if m:
              d = json.loads(m.group(2))
              print("例", m.group(1), {k: sorted(v.keys()) for k, v in d.items()})
              print("kochi", json.dumps(d.get("kochi"), ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grp-check
          path: out/
