# 南関 AI v3 第 9 版(人気を見ない版・182 列)の毎日の前日版。手元の `py -3.12 -X utf8 src/t9_forecast.py table DATE pre` を PC 無しで回す。
#
# ⛔学習はしない(固定の模型 t9_Y1/Y3・t9_models.json・t9_s2.json を固定ファイルから読む)。
# ⛔本番に書くのは最後の 1 手順だけ(nar_ai_marks の REST upsert・model='v3-9'・timing='morning')。write=yes の dispatch のときだけ。
# 固定ファイル(毎日変わらないもの・約 293MB の tar.gz)は公開 repo なので暗号化したリリース資産に置く:
#   tag = inputs.asset_tag(既定 v3-assets-20260929・第 8 版に戻すときは v3-assets-20260928)・資産 v3_fixed.tar.gz.enc・鍵 = secrets.V3_ASSET_KEY。作り方(手元・1 回):
#   tar -czf - -C <組んだフォルダ> v3_data raw models cyokyo_csv kd | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:V3_ASSET_KEY -out v3_fixed.tar.gz.enc
#   中の形: v3_data/*.parquet・*.json / raw/archive/*.csv.gz / models/t7e_*・t8_s2.json・t9_*・t9_s2.json / cyokyo_csv/cyokyo_{場}_{年}.csv / kd/NR/NR.DAT・kd/NS/NS.DAT
# 毎日変わる材料は便の中で取る: 前向きの写し(db_*_forward_t3 = t7e_forecast.py fetch・公開の読み鍵)・能力試験(t7e_forecast.py nk・公式サイト)・
#   追い切りの毎日の分(v3_daily.py が nar_kb_works から読む・読むだけ)。
name: nar-ai-v3

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '予想する日(空= JST 明日)。例 2026-09-29'
        required: false
        default: ''
      write:
        description: '本番 nar_ai_marks(v3-9・morning)に書く(yes/no)'
        required: false
        default: 'no'
      asset_tag:
        description: '固定ファイルのリリース tag'
        required: false
        default: 'v3-assets-20260929'
      auto:
        description: 'yes = DB の時計(pg_cron)からの起動。全レースの印が済みなら何もしない(手で回すときは no のまま)'
        required: false
        default: 'no'

concurrency:
  group: nar-ai-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      V3_DATA: ${{ github.workspace }}/v3/v3_data
      V3_RAW: ${{ github.workspace }}/v3/raw
      V3_MODELS: ${{ github.workspace }}/v3/models
      V3_CYOKYO_CSV: ${{ github.workspace }}/v3/cyokyo_csv
      V3_KD: ${{ github.workspace }}/v3/kd
      V3_T14: ${{ github.workspace }}/v3/t14
      V3_F10K: ${{ github.workspace }}/v3/f10k
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install python packages (手元と同じ版)
        run: pip install -q "pandas==2.2.3" "numpy==1.26.4" "pyarrow==25.0.1" "lightgbm==4.7.0" "scipy==1.14.1" "scikit-learn==1.9.0" requests beautifulsoup4 lxml

      - name: day
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            echo "$IN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "date は YYYY-MM-DD で"; exit 1; }
            DAY="$IN_DATE"
          elif [ "$(TZ=Asia/Tokyo date +%H)" -lt 12 ]; then
            DAY=$(TZ=Asia/Tokyo date +%F)            # 当日 09:35 の取り直し(前夜に作れなかった日だけ動く)
          else
            DAY=$(TZ=Asia/Tokyo date -d tomorrow +%F)
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "day=$DAY"

      # ---------------------------------------------------------------- 起動前の確かめ(2026-10-01・9/30 の事故の再発防止)
      # 開催なし・全レースの印が済み(DB の時計からの起動のとき)= 以降を飛ばして緑。出馬表が DB に足りなければ
      # 取り込み(nar-refresh・20 分おき)を最大 40 分待つ。1 R も来なければ赤(= 持ち主へ失敗のメール)。
      - name: precheck (racing day / already done / race card in DB)
        id: pc
        env:
          AUTO: ${{ (github.event_name == 'schedule' || github.event.inputs.auto == 'yes') && 'yes' || 'no' }}
        run: |
          if [ "$AUTO" = "yes" ]; then A=--auto; else A=; fi
          python -X utf8 pipeline/ai/v3/v3_precheck.py "${{ steps.d.outputs.day }}" $A --wait-min 40

      # ---------------------------------------------------------------- 固定ファイル(暗号化したリリース資産)
      - name: download and decrypt fixed files
        if: steps.pc.outputs.run == 'yes'
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          TAG: ${{ github.event.inputs.asset_tag }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY  # Get-Content 経由の末尾改行を除く
          : "${V3_ASSET_KEY:?secrets.V3_ASSET_KEY が無い}"
          mkdir -p in v3
          gh release download "${TAG:-v3-assets-20260929}" -p 'v3_fixed.tar.gz.enc' -D in
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_fixed.tar.gz.enc | tar -C v3 -xzf -
          rm -f in/v3_fixed.tar.gz.enc
          du -sh v3/*; df -h / | tail -n 1

      # 第 10 版の上乗せの模型(t10_up.json・t10_up_{p3,p1}_s{0,1,2}.txt)。無ければ第 9 版のまま印を出す
      - name: download t10 uplift models
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-t10-up-20261001 -p 'v3_t10_up.tar.gz.enc' -D in
          mkdir -p v3/models
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_t10_up.tar.gz.enc | tar -C v3/models -xzf -
          rm -f in/v3_t10_up.tar.gz.enc
          ls -l v3/models | grep t10_up

      # 第11版 = 束 t14(37 列の木・談話の 7 項目の係数・談話の集計 8/31 締め・調教欄 2018〜20)。無ければ第10版 + 談話の印のまま
      - name: download t14 bundle files
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-t14-20261010 -p 'v3_t14.tar.gz.enc' -D in
          mkdir -p v3/t14
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_t14.tar.gz.enc | tar -C v3/t14 -xzf -
          rm -f in/v3_t14.tar.gz.enc
          ls -l v3/t14 v3/t14/cyokyo_old | head -30

      # 第12版 = 束 f10k(材料 1 万個のふるいの 60 列の木 3 本)。無ければ第11版のまま
      - name: download f10k bundle files
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-f10k-20261011 -p 'v3_f10k.tar.gz.enc' -D in
          mkdir -p v3/f10k
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_f10k.tar.gz.enc | tar -C v3/f10k -xzf -
          rm -f in/v3_f10k.tar.gz.enc
          ls -l v3/f10k

      # 決め 23 = 馬主 5 列を走った時の馬主で作り直して全段を学び直した模型一式 + 南関の走りごとの馬主の写し(v3/kd)。
      # 展開が全部済んでから一度に上書きする。無ければ今の模型 + 台帳の馬主のまま(v7c_owner は写しが無いと使わない)
      - name: download owner-rt model set
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-own-20261011 -p 'v3_own.tar.gz.enc' -D in
          mkdir -p in/own
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_own.tar.gz.enc | tar -C in/own -xzf -
          test -f in/own/kd/kd_se_owner_nankan.parquet && test -f in/own/models/t9_Y3.txt && test -f in/own/f10k/f10k_bundle.json
          cp -r in/own/. v3/
          rm -rf in/own in/v3_own.tar.gz.enc
          ls -l v3/kd v3/models/t9_* v3/models/t10_up* v3/t14/t14_bundle* v3/f10k

      # 決め 24 = 並び読み(全場の過去 10 走を読む小さな模型・2026-10-12)の固定ファイル(時計のならし・重み)。
      # 決め 25(2026-10-13)= 次の版(DEFG + 着差の補助)。同じ名前の包み・seq2_live.prep が seq2_prod.json の形で材料の作りを選ぶ。
      # 公式の表は表の手順の中で落とす(v3_daily → k0_dl・約 3 分)。無ければ材料を作らない = 当日版は第12版のまま
      - name: download seq2 files
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-seq3-20261013 -p 'v3_seq2.tar.gz.enc' -D in
          mkdir -p v3/seq2
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_seq2.tar.gz.enc | tar -C v3/seq2 -xzf -
          rm -f in/v3_seq2.tar.gz.enc
          ls -l v3/seq2

      # 初出走の層(決め 28・2026-10-14)= 寸評・時計 35 列の木 種 3 本 × 前日版用・直前版用 + debut_tp.json。無ければ第12版のまま(debut_live が落ちて log に出る)
      - name: download debut files
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3-debut-20261014 -p 'v3_debut.tar.gz.enc' -D in
          mkdir -p v3/debut
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_debut.tar.gz.enc | tar -C v3/debut -xzf -
          rm -f in/v3_debut.tar.gz.enc
          ls -l v3/debut

      # 束 t14 の談話 14 列: 本文 → intfloat/multilingual-e5-small(手元と同じ版・CPU)。失敗しても第10版 + 談話の印のまま進む
      - name: install text model (t14 danwa)
        if: steps.pc.outputs.run == 'yes'
        continue-on-error: true
        run: |
          set -o pipefail
          pip install -q "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
          pip install -q "sentence-transformers==6.1.0" "transformers==5.18.0"
          python -c "from sentence_transformers import SentenceTransformer as S; m = S('intfloat/multilingual-e5-small', device='cpu', revision='614241f622f53c4eeff9890bdc4f31cfecc418b3'); print('e5-small', m.encode(['query: 調子は良い'], normalize_embeddings=True).shape)"

      # ---------------------------------------------------------------- 毎日変わる材料(読むだけ)
      - name: fetch forward copy (db_*_forward_t3)
        if: steps.pc.outputs.run == 'yes'
        run: python -X utf8 pipeline/ai/v3/t7e_forecast.py fetch "${{ steps.d.outputs.day }}" 2>&1 | tee -a out_log.txt

      - name: fetch ability trials (nk_shiken)
        if: steps.pc.outputs.run == 'yes'
        run: python -X utf8 pipeline/ai/v3/t7e_forecast.py nk "${{ steps.d.outputs.day }}" 2>&1 | tee -a out_log.txt

      - name: fetch pedigree and JRA runs of the day's runners (nk_pedjra)
        if: steps.pc.outputs.run == 'yes'
        # 失敗しても次に進む(live が無い・壊れていれば v7d_run は固定ファイルのまま動く)
        continue-on-error: true
        timeout-minutes: 15
        run: python -X utf8 pipeline/ai/v3/nk_pedjra.py "${{ steps.d.outputs.day }}" "$V3_KD" 2>&1 | tee -a out_log.txt

      # ---------------------------------------------------------------- 前日版の表と書き込み(ここだけ本番の鍵を渡す)
      - name: table (pre) and write marks (REST upsert only)
        if: steps.pc.outputs.run == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event_name == 'schedule' && 'yes' || github.event.inputs.write }}
          V3_DUMP_FEATS: '1'  # 照合用の材料 csv(暗号化した成果物にだけ入る)
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}  # 談話の印: nar_kb_danwa に無いレースを競馬ブックの頁から読む(danwa_marks.py)
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_DATA_DIR: /tmp/kbdata_v3
          V3_SEQ2: v3/seq2  # 並び読みの時計のならし(上の download seq2 files)
          V3_OFFICIAL: v3/official  # 並び読みの公式の表(v3_daily が落とす)
          V3_DEBUT: v3/debut  # 初出走の層の模型(上の download debut files)
        run: |
          set -o pipefail
          mkdir -p out
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          echo "day=${{ steps.d.outputs.day }} write=$WRITE"
          python -X utf8 pipeline/ai/v3/v3_daily.py "${{ steps.d.outputs.day }}" out $W 2>&1 | tee -a out_log.txt

      - name: seal outputs (A3)
        if: always() && steps.pc.outputs.run == 'yes'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          mkdir -p stage
          cp out/* out_log.txt stage/ 2>/dev/null || true
          bash ops/artifact_seal.sh seal stage sealed/nar-ai-v3.tar.gz.enc
      - uses: actions/upload-artifact@v7
        if: always() && steps.pc.outputs.run == 'yes'
        with:
          name: nar-ai-v3-${{ github.run_number }}
          path: sealed/
          retention-days: 7
          if-no-files-found: warn

      # ---------------------------------------------------------------- 照合用(手元の .v3_asset_key で解ける)
      - name: seal table csv with V3_ASSET_KEY
        if: always() && steps.pc.outputs.run == 'yes'
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          mkdir -p sealed_csv
          ls out/*.csv >/dev/null 2>&1 || { echo "out/*.csv が無い"; exit 0; }
          tar -C out -czf - $(cd out && ls *.csv) | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:V3_ASSET_KEY -out sealed_csv/nar-ai-v3-csv.tar.gz.enc
          ls -l sealed_csv
      - uses: actions/upload-artifact@v7
        if: always() && steps.pc.outputs.run == 'yes'
        with:
          name: nar-ai-v3-csv-${{ github.run_number }}
          path: sealed_csv/
          retention-days: 7
          if-no-files-found: warn
          
      # ---------------------------------------------------------------- v29(市場のずれ模型)の前日の土台 → 当日の便 v3-gap-live が読む
      - name: seal v29 base with V3_ASSET_KEY
        if: always() && steps.pc.outputs.run == 'yes'
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          DAY: ${{ steps.d.outputs.day }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          mkdir -p sealed_v29
          [ -f "out/${DAY}_v29_base.csv" ] || { echo "v29 base が無い"; exit 0; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:V3_ASSET_KEY -in "out/${DAY}_v29_base.csv" -out sealed_v29/v29_base.csv.enc
          # 決め 24: 並び読みの材料(無い日 = 当日版は第12版のまま)
          if [ -f "out/${DAY}_seq2.npz" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:V3_ASSET_KEY -in "out/${DAY}_seq2.npz" -out sealed_v29/seq2.npz.enc
          else
            echo "並び読みの材料なし(当日版は第12版のまま)"
          fi
          ls -l sealed_v29
      - uses: actions/upload-artifact@v7
        if: always() && steps.pc.outputs.run == 'yes'
        with:
          name: v3-gap-base-${{ steps.d.outputs.day }}
          path: sealed_v29/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      # 2026-10-03 監査 A-2: heartbeat を書く(見張りの fail 検査に載る)
      - name: heartbeat ok
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py nar_ai_v3 ok
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py nar_ai_v3 fail 失敗
