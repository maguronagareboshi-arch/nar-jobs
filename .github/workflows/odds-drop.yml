# 締め切り前にオッズが下がった馬(2026-10-17)。今週・先週の 2 週ぶんを公開バケット cond-stats の v1/odds-drop/latest.json へ上書きで上げる毎晩の便。
# 台本 cloud/odds_drop.py(計算の正本= nar-site research/odds-drop/build_mock.mjs)。
# ⛔本番 DB では REST の単純 select だけ(日ごと)。書くのは Storage の cond-stats だけ。
# 既定= 毎晩 JST 23:10(= UTC 14:10)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: odds-drop
on:
  schedule:
    - cron: '10 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (no upload)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: odds-drop
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s tests -p "test_odds_drop.py"
      - name: odds drop
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            python3 cloud/odds_drop.py --out "$RUNNER_TEMP/odds-drop.json"
            ls -l "$RUNNER_TEMP/odds-drop.json"
          else
            python3 cloud/odds_drop.py --apply
            # 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
            python3 cloud/beat.py odds_drop ok
          fi

      # 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py odds_drop fail 失敗
