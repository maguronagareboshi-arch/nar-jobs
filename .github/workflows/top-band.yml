# 10/15 トップの帯「今日の出走馬」(移籍後の初出走・休み明け・距離が大きく替わる・前走と別の場)の件数と一覧を
# nar_meta 'top_band'(件数)と 'top_band:YYYY-MM-DD'(一覧)へ書く便。台本 cloud/top_band.py。
# 10/16 前の晩に翌日分を数える形へ: 翌日の出馬表は前日までに入っている(実測)= 夜 22:10 に翌日分を top_band_next(移籍なし)と
#   auction_next へ。移籍の表(nar_horse_changes)は当日 05:33 の便で半分ほど足される= 朝 06:50 に今日分を top_band へ(移籍つき)。
#   09:40・12:40 は取消の反映(冪等)。heartbeat= 夜 top_band_next・朝 top_band。
# ⛔本番 DB では REST の単純 select だけ(その日の出走+前走 1 本)。古い top_band:* は 7 日で消す。1 回およそ 1 分。
# 手動= workflow_dispatch(dry_run= 書かずに件数を log に出す・date= 空なら今日)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: top-band
on:
  schedule:
    # 10/29 夜の回を 3 本に= GitHub の予約は 4〜6 時間遅れて起きる日がある(10/26・10/27 は 22:10 の予約が翌 3〜4 時)
    #   ユーザー「日付が変わって 5 分後には出ていてほしい」= 早い 2 本のどれかが 0 時までに済めばよい(冪等= 後の回が上書き)
    - cron: '10 8 * * *'         # JST 17:10= 前の晩の回(翌日分を top_band_next と auction_next へ)
    - cron: '10 11 * * *'        # JST 20:10= 前の晩の回
    - cron: '10 13 * * *'        # JST 22:10= 前の晩の回(取消・追加の反映)
    - cron: '50 21 * * *'        # JST 06:50= 朝の回(移籍の表が 05:33 の便で 06:15 ごろまでに入った後)
    - cron: '40 0 * * *'         # JST 09:40(取消の反映)
    - cron: '40 3 * * *'         # JST 12:40(念のため)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (no write)'
        required: false
        default: true
        type: boolean
      night:
        description: 'night run (next day to top_band_next and auction_next)'
        required: false
        default: false
        type: boolean
      date:
        description: 'YYYY-MM-DD (empty = today JST, or tomorrow for night)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: top-band
  cancel-in-progress: false
jobs:
  band:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s tests -p "test_top_band.py"
      - name: top band
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
          NIGHT_IN: ${{ github.event.inputs.night }}
          DAY: ${{ github.event.inputs.date }}
          SCHED: ${{ github.event.schedule }}
          SUPABASE_DB_PASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          # 夜の回= 22:10 の予定の便か、手動で night を選んだとき
          # ⛔起きた時刻で見分けない= 10/20・10/21 は予定の便が 4 時間 46〜49 分遅れて翌 02:56 に起き、朝の回と数えて top_band_next が赤
          if [ "$NIGHT_IN" = "true" ] || [ "$SCHED" = "10 8 * * *" ] || [ "$SCHED" = "10 11 * * *" ] || [ "$SCHED" = "10 13 * * *" ]; then NIGHT=1; else NIGHT=0; fi
          if [ -z "$DAY" ]; then
            # 夜の回が日付をまたいで起きたら、もう「翌日」は今日
            # 10/30 DB(pg_cron)から 20:10・22:10・06:50 に手動の形で起こす= 手動の夜の回も 0 時を過ぎたら今日分(以前は手動なら常に翌日)
            if [ "$NIGHT" = "1" ] && [ $((10#$H)) -ge 12 ]; then DAY=$(TZ=Asia/Tokyo date -d tomorrow +%F); else DAY=$(TZ=Asia/Tokyo date +%F); fi
          fi
          if [ "$DRY" = "true" ]; then W=--dry-run; else W=--apply; fi
          echo "夜の回= $NIGHT・日= $DAY・$W"
          if [ "$NIGHT" = "1" ]; then
            # 10/16 移籍の表(nar_horse_changes)は朝 05:33 の便でしか作っていなかった= 翌日の出走表は前日に揃っている
            #   (10/17 分 341 行・所属の空 0 を確認)ので、夜にも作ってから数える(冪等= 朝の便と重ねても増えない)
            pip install -q -r cloud/requirements.txt
            # 10/29 移籍の表が作れなくても翌日分の頭数は書く(10/26〜10/28 は scramp 1.5 で接続が落ち、翌日分ごと止まっていた)
            #   移籍の数は朝 06:50 の回が付け直す
            if [ "$DRY" = "true" ]; then python3 cloud/horse_changes.py || echo "::warning::horse_changes 失敗"; else python3 cloud/horse_changes.py --apply || echo "::warning::horse_changes 失敗"; fi
            python3 cloud/top_band.py $W --date "$DAY" --key top_band_next
            python3 cloud/auction_today.py $W --date "$DAY" --key auction_next
            JOB=top_band_next
          else
            python3 cloud/top_band.py $W --date "$DAY"
            JOB=top_band
          fi
          # 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
          if [ "$DRY" != "true" ]; then python3 cloud/beat.py "$JOB" ok; fi
          echo "JOB=$JOB" >> "$GITHUB_ENV"

      # 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py "${JOB:-top_band}" fail 失敗
