# 研究用・1 回きり。兵庫の格付修正の直前のヤラズの痕跡(cloud/yarazu_hyogo.py)を 2014-01〜2026-09 で集計し docs/yarazu-hyogo/result2.md を書く(⑥見込みのずれ・⑦調子をそろえた比べを足した・result.md は残す)。
# ⛔本番 DB では REST の単純 select だけ(年ごと・order は一意)。集計は全部 Python。書き込みなし。schedule なし。
name: yarazu-hyogo
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yarazu-hyogo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt numpy
      - name: yarazu hyogo
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python -X utf8 cloud/yarazu_hyogo.py
          if [ -n "$(git status --porcelain docs/yarazu-hyogo)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/yarazu-hyogo
            git commit -m "兵庫 降級前のヤラズ 研究集計2 $(TZ=Asia/Tokyo date +%F)"
            for i in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
          else
            echo "差分なし"
          fi
