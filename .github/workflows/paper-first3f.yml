# 紙面 PDF の各馬の前半3F を nar_paper_runs に入れる(毎朝 1 回・一覧にあって表にまだ無い PDF だけ)。
# PDF は公開後に差し替わらない= 1 日 1 回で足りる。置き場の URL は secrets の PAPER_BASE_URL だけ(⛔コードとログに出さない)。
#
# 手押し: Actions → 「Paper first3f」→ Run workflow
#   dates = YYYY-MM-DD をカンマ区切り(空なら 今日-1〜+7 日)
#   force = 表に行がある PDF も取り直す
name: Paper first3f

on:
  schedule:
    - cron: '17 22 * * *'          # JST 07:17(nar-ai-feat 06:30 の後)
  workflow_dispatch:
    inputs:
      dates:
        description: 'YYYY-MM-DD をカンマ区切り(空なら 今日-1〜+7 日)'
        default: ''
        type: string
      force:
        description: '表に行がある PDF も取り直す'
        default: false
        type: boolean

concurrency:
  group: paper-first3f
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120           # PDF は約 5 日前に 3 日分 10〜15 本まとめて出る(1 本 約 3 分)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 岩手(盛岡・水沢)の開催が今日も明日も無ければ以降を飛ばす(標準ライブラリだけ= pip の前)。
      # 手押しで dates を渡したときは判定しない= 必ず回す。REST が失敗したら skip にしない(止まる側に倒さない)
      - name: iwate race day gate
        id: gate
        if: github.event.inputs.dates == ''
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python -X utf8 cloud/paper_first3f.py --gate

      # 文字認識の opencv が libGL を要る
      - name: system libs
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get install -y libgl1

      - name: install
        if: steps.gate.outputs.skip != 'true'
        run: pip install pypdfium2==5.13.0 rapidocr-onnxruntime==1.4.4 pillow==12.3.0 numpy==1.26.4

      - name: read and upsert
        if: steps.gate.outputs.skip != 'true'
        env:
          PAPER_BASE_URL: ${{ secrets.PAPER_BASE_URL }}
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DATES: ${{ github.event.inputs.dates }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set --
          if [ -n "$DATES" ]; then set -- "$@" "--dates=$DATES"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python -X utf8 cloud/paper_first3f.py "$@"
          # 監査 A8(2026-09-24) 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
          python3 cloud/beat.py paper_first3f ok

      # 監査 A8(2026-09-24) 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py paper_first3f fail 失敗
