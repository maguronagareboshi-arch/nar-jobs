# 研究用・1 回きり。(cloud/trifecta_winner_late.py)= 決まった 3連単の組が締め切り直前に増えていたかを 9/8〜10/19 で数え docs/trifecta-winner-late/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。schedule なし。
name: trifecta-winner-late
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trifecta-winner-late
  cancel-in-progress: false
jobs:
  winlate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: trifecta winner late
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/trifecta_winner_late.py
          if [ -n "$(git status --porcelain docs/trifecta-winner-late)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/trifecta-winner-late
            git commit -m "決まった3連単の組の直前の票 研究集計 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "差分なし"
          fi
