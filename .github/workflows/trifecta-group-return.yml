# 研究用・1 回きり。(cloud/trifecta_group_return.py)= 締め切り 2 分前に r が小さい馬の 1 着の組を 3連単で買った回収を 9/8〜9/30 で数え docs/trifecta-group-return/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。schedule なし。
name: trifecta-group-return
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trifecta-group-return
  cancel-in-progress: false
jobs:
  trigrp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: trifecta group return
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/trifecta_group_return.py
          if [ -n "$(git status --porcelain docs/trifecta-group-return)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/trifecta-group-return
            git commit -m "3連単 1着の組 回収 研究集計 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "差分なし"
          fi
