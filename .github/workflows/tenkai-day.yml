name: tenkai-day
# 2026-11-16 南関の展開図(各馬の最初の角・4 角の位置の予想)を、指定した日だけ作り直す手動の便。
#   ふだんは前日の便 nar-ai-v3 の中で作る(pipeline/ai/v3/tenkai_live.py)。これは「段が入る前の日」「便が落ちた日」の作り直し用。
#   公式の表(nar_races・nar_runs)を読み、公開バケット cond-stats/tenkai/v1/<日>/<場>-<R>.json へ置くだけ。
#   ⛔予想の印・率(nar_ai_marks)は読まない・書かない。
#   通信量: 便のキャッシュ k0-*(nar-ai-v3 などが残した前回の表)があれば直近の月だけ読む。無ければ丸ごと(約 1 GB)。
on:
  workflow_dispatch:
    inputs:
      day:
        description: '作る日(YYYY-MM-DD・南関の開催日)'
        required: true
      write:
        description: 'yes = 公開バケットへ置く / no = 作るだけ(記録で確かめる)'
        required: false
        default: 'yes'

concurrency:
  group: tenkai-day
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tenkai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ai-code
        with:
          key: ${{ secrets.V3_AI_DEPLOY_KEY }}
          mode: fallback
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install python packages (前日の便と同じ版)
        run: pip install -q "pandas==2.2.3" "numpy==1.26.4" "pyarrow==25.0.1" "lightgbm==4.7.0" "scipy==1.14.1" "scikit-learn==1.9.0"
      - name: check day
        env:
          DAY: ${{ github.event.inputs.day }}
        run: |
          echo "$DAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::day の形が違う: $DAY"; exit 1; }
      - name: download tenkai files
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          : "${V3_ASSET_KEY:?secrets.V3_ASSET_KEY が無い}"
          mkdir -p in v3/tk
          gh release download v3-tk-20261116 -p 'v3_tk.tar.gz.enc' -D in
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_tk.tar.gz.enc | tar -C v3/tk -xzf -
          rm -f in/v3_tk.tar.gz.enc
          ls -l v3/tk
      # 前回の公式の表(暗号化した控え)。読むだけ = この便は控えを保存しない
      - name: restore k0 cache
        id: k0r
        uses: actions/cache/restore@v6
        with:
          path: k0enc
          key: k0-tenkai-day-never-saved
          restore-keys: k0-
      - name: open k0 cache
        if: steps.k0r.outputs.cache-matched-key != ''
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
        run: |
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          mkdir -p k0cache
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in k0enc/k0.tar.gz.enc | tar -C k0cache -xzf - || { echo "k0 cache: 開けない → 丸ごと読む"; rm -rf k0cache; }
          rm -f k0cache/dirty.flag
      - name: official tables (races・runs)
        env:
          K0_CACHE: ${{ github.workspace }}/k0cache
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          [ -d k0cache ] || unset K0_CACHE
          python -X utf8 pipeline/ai/kochi/k0_dl.py v3/official/ races runs
          ls -l v3/official
      - name: tenkai (position preview to public bucket)
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event.inputs.write }}
          DAY: ${{ github.event.inputs.day }}
          V3_OFFICIAL: v3/official
          V3_TK: v3/tk
        run: |
          set -o pipefail
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          python -X utf8 pipeline/ai/v3/tenkai_live.py "$DAY" --out out_tenkai $W
          if [ -z "$W" ]; then find out_tenkai -name '*.json' | sort | head -40; fi
      - name: tenkai sim data (public bucket)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event.inputs.write }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          set -o pipefail
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          pip install -q pillow || true   # 勝負服の図を升目に読むのに使う(無ければ仮の柄で続く)
          export TKSIM_SILKS=1 TKSIM_SILK_CACHE="$RUNNER_TEMP/tksilk"   # 騎手の本物の勝負服(2026-11-17 ユーザー「許可はもらっています」。引っ込めるときはこの行を消す)
          python -X utf8 pipeline/ai/v3/tenkai_sim_live.py "$DAY" --out out_tksim $W
