# 本体: データ鮮度の独立見張り(DESIGN §21.1 の穴=「ジョブ自体が起動しない」故障の検知)。
# 2026-09-08 nar-viewer(private)から nar-jobs(public)へ移設(#529)。
# 本体(nar-refresh)と別の cron なので、本体のスケジュールが GitHub 側で間引かれても
# こちらのどれかが走れば 3 時間超のストールを検知して赤くなる(=所有者へ通知メール)。
# JST 09:25〜22:25 の毎時25分。何も悪くなければ10秒で緑。
name: nar-watchdog

on:
  schedule:
    - cron: '25 0-13 * * *'
    - cron: '40 23 * * *'   # JST 08:40 に1回= #142 の高知「結果ゼロ開催日」検知(下の kochi-results)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    if: github.event.schedule != '40 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check nar_races freshness (fail if stale > 3h)
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime as dt
          url = os.environ['SUPABASE_URL'] + '/rest/v1/nar_races?select=updated_at&order=updated_at.desc&limit=1'
          req = urllib.request.Request(url, headers={'apikey': os.environ['SUPABASE_SERVICE_KEY'],
                                                     'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_KEY']})
          rows = json.loads(urllib.request.urlopen(req, timeout=30).read())
          last = dt.datetime.fromisoformat(rows[0]['updated_at'].replace('Z', '+00:00'))
          age = (dt.datetime.now(dt.timezone.utc) - last).total_seconds()
          print(f'nar_races last update: {last.isoformat()} ({age/60:.0f} min ago)')
          raise SystemExit(0 if age < 3 * 3600 else 1)
          PY

  # §77 W3: 2 分刻みのオッズ(公開リポ nar-odds-collector の loop.py)が生きているかの見張り。
  # 「発走 40 分前〜8 分後のレースが今あるのに、nar_odds_ticks の当日最新が 12 分より古い」なら赤(=所有者へメール)。
  # 対象レースが無い時間帯・非開催日は緑。復旧= 公開リポの collect を手で起こす(workflow_dispatch)。
  odds-live:
    if: github.event.schedule != '40 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check 2-minute odds ticks (fail if stale > 12 min while races are near)
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, re, urllib.request, datetime as dt
          JST = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(JST); today = now.date().isoformat(); nm = now.hour * 60 + now.minute
          def get(path):
              req = urllib.request.Request(os.environ['SUPABASE_URL'] + '/rest/v1/' + path,
                  headers={'apikey': os.environ['SUPABASE_SERVICE_KEY'], 'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_KEY']})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          races = get(f'nar_races?select=track,race_no,post_time&race_date=eq.{today}')
          def pm(s):
              m = re.fullmatch(r'(\d{2})(\d{2})', str(s or '').strip()); return int(m.group(1)) * 60 + int(m.group(2)) if m else None
          near = [r for r in races if pm(r.get('post_time')) is not None and -8 <= pm(r['post_time']) - nm <= 40]
          print(f'JST {now:%H:%M} races today={len(races)} near={len(near)}')
          if not near:
              raise SystemExit(0)
          t = get(f'nar_odds_ticks?select=t&race_date=eq.{today}&order=id.desc&limit=1')
          last = t[0]['t'] if t else None
          print(f'latest tick today: {last}')
          if not last:
              raise SystemExit(1)
          lm = int(last[:2]) * 60 + int(last[3:5]); age = nm - lm
          print(f'age {age} min')
          raise SystemExit(0 if 0 <= age <= 12 else 1)
          PY

  # §245(2026-09-23) 7 券種の板の見張り= 前日に開催があったのに nar_odds_full の板が 1 レースも無い場があれば赤。
  # 出どころ= 9/11 に collect.yml の手順名の「: 」で便が 1 日止まり、船橋など 4 場の板が無いと後で分かった(静かに欠けていた)。
  # 読みは 2 本だけ(nar_races の前日・nar_odds_full の前日 馬連)= 軽い。⛔本番 DB で集計はしない。
  boards-yesterday:
    if: github.event.schedule == '40 23 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check full odds boards for yesterday (fail if a track raced but has no board)
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime as dt
          JST = dt.timezone(dt.timedelta(hours=9))
          day = (dt.datetime.now(JST).date() - dt.timedelta(days=1)).isoformat()
          def get(path):
              req = urllib.request.Request(os.environ['SUPABASE_URL'] + '/rest/v1/' + path,
                  headers={'apikey': os.environ['SUPABASE_SERVICE_KEY'], 'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_KEY']})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          races = get(f'nar_races?select=track,race_no&race_date=eq.{day}&limit=1000')
          boards = get(f'nar_odds_full?select=track,race_no&race_date=eq.{day}&kind=eq.umaren&limit=1000')
          want, have = {}, {}
          for r in races: want.setdefault(r['track'], set()).add(int(r['race_no']))
          for r in boards: have.setdefault(r['track'], set()).add(int(r['race_no']))
          print(f'{day}: tracks={len(want)} races={len(races)} boards={len(boards)}')
          if not want:
              print('no racing yesterday'); raise SystemExit(0)
          bad = []
          for t, rs in sorted(want.items()):
              got = len(have.get(t, set()) & rs)
              print(f'  {t}: board {got}/{len(rs)}')
              if got == 0: bad.append(t)
          if bad:
              print('NO BOARD AT ALL: ' + ', '.join(bad))
          raise SystemExit(1 if bad else 0)
          PY

  # 高知の自前計測(前半3F)の見張り。§157 段 3(2026-09-12)で旧 DB の見張りは外し、本体の nar_own_runs を見る
  kochi-results:
    if: github.event.schedule == '40 23 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # §157 段 3(2026-09-12): 「結果ゼロ」の見張り(旧 DB keiba_*)は外した= 高知の結果は 15 場の公式取得(nar_runs)に一本化
      # §98 の見張り= 高知の翌朝自動計測(手元PCの kochi_auto.py)が動いているか。
      # ⛔PCが閉じていても鳴らせるのはここだけ(GPU/yt-dlp が要るのでクラウドでは代われない)。
      #   赤= 開催から48時間たっても各馬の前半3F が1頭も入っていない日がある(=計測が回っていない)。
      #   黄(fail にしない)= kochi_auto_status.ran が7日より古い(PC放置の合図)。
      - name: check kochi first3f not measured (fail if a race day is still empty after 48h)
        if: always()
        env:
          NAR_SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          NAR_SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime as dt
          def get(base, key, path):
              req = urllib.request.Request(base + '/rest/v1/' + path,
                  headers={'apikey': key, 'Authorization': 'Bearer ' + key})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          NAR, NKEY = os.environ['NAR_SUPABASE_URL'], os.environ['NAR_SUPABASE_SERVICE_KEY']
          # ⛔JST で数える(Actions は UTC。08:40 JST の便は UTC ではまだ前日= 土曜の開催が火曜まで見えなくなる)
          today = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=9)).date()
          # ⛔48時間= 開催日そのものは数えない(前日ぶんは朝の便待ちで空でも正常)
          lo, hi = (today - dt.timedelta(days=30)).isoformat(), (today - dt.timedelta(days=2)).isoformat()
          rows = get(NAR, NKEY, f'nar_races?select=race_date&track=eq.%E9%AB%98%E7%9F%A5&race_no=eq.1'
                     f'&race_date=gte.{lo}&race_date=lte.{hi}&order=race_date.desc&limit=50')
          days = sorted({r['race_date'] for r in rows}, reverse=True)
          gaps = []
          for d in days[:12]:
              # §157: 前半3F は本体の nar_own_runs(高知の自前計測)。行は測れた馬ぶんだけ立つ
              rs = get(NAR, NKEY, f'nar_runs?select=runner_number&track=eq.%E9%AB%98%E7%9F%A5&race_date=eq.{d}&limit=300')
              if not rs:
                  continue          # 出走馬ごと無い日は公式取得の受け持ち。二重に鳴らさない
              own = get(NAR, NKEY, f'nar_own_runs?select=umaban&track=eq.%E9%AB%98%E7%9F%A5&race_date=eq.{d}&first3f=not.is.null&limit=300')
              if not own:
                  gaps.append(f'{d}: 出走 {len(rs)}頭なのに各馬の前半3F が 1 頭も無い(翌朝の自動計測が回っていない)')
          print(f'高知の開催日(公式・{lo}..{hi}): {len(days)}日 / 点検 {min(len(days),12)}日')
          for g in gaps:
              print('MISSING', g)
          # PC放置の合図(fail にはしない)
          try:
              st = get(NAR, NKEY, 'nar_meta?select=value&key=eq.kochi_auto_status')
              ran = (st[0]['value'] or {}).get('ran') if st else None
          except Exception as e:
              ran = None
              print('WARN kochi_auto_status が読めない:', str(e)[:120])
          if ran:
              age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(ran)).days
              print(f'kochi_auto_status.ran = {ran} ({age}日前)')
              if age >= 7:
                  print('WARN 7日以上まわっていない= PC が開かれていない疑い')
          else:
              print('WARN kochi_auto_status がまだ無い(初回実走まではこれで正常)')
          if gaps:
              print('修理= PC を開いて 高知競馬\\01_高知映像計測\\kochi_auto_now.cmd')
          raise SystemExit(1 if gaps else 0)
          PY

  # §195b 大井 主催者公式の「出来事」が入っているか。⛔読むだけ。
  #   9/8〜9/16 は先方が GitHub ランナーの IP に 403 を返していて、段が「0 件でも exit 0」だったため
  #   8 日間だれも気づかなかった(§195 段 1)。中継に替えたので、止まったら**ここで鳴らす**。
  #   赤= ooi_official の最大 race_date が、大井の直近の開催日(今日以前)より 2 日以上古い。
  #   非開催の期間は 0(直近の開催日が動かないので遅れも増えない)。
  ooi-official:
    if: github.event.schedule == '40 23 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check ooi official health events are fresh (fail if 2+ days behind the last Oi race day)
        env:
          NAR_SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          NAR_SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime as dt
          BASE, KEY = os.environ['NAR_SUPABASE_URL'], os.environ['NAR_SUPABASE_SERVICE_KEY']
          def get(path):
              req = urllib.request.Request(BASE + '/rest/v1/' + path,
                  headers={'apikey': KEY, 'Authorization': 'Bearer ' + KEY})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          OI = '%E5%A4%A7%E4%BA%95'                       # 大井
          # ⛔JST で数える(Actions は UTC。08:40 JST は UTC ではまだ前日)
          today = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=9)).date()
          lo = (today - dt.timedelta(days=60)).isoformat()
          races = get(f'nar_races?select=race_date&track=eq.{OI}&race_no=eq.1'
                      f'&race_date=gte.{lo}&race_date=lt.{today.isoformat()}'   # 今日は数えない(出来事は翌 10:43 の便で入る)
                      '&order=race_date.desc&limit=60')
          days = sorted({r['race_date'] for r in races}, reverse=True)
          if not days:
              print(f'大井の開催日が直近 60 日に無い({lo}..{today}) = 見張らない')
              raise SystemExit(0)
          last_race = days[0]
          ev = get('nar_horse_health_events?select=race_date&source_kind=eq.ooi_official'
                   '&order=race_date.desc&limit=1')
          last_ev = ev[0]['race_date'] if ev else None
          print(f'大井の直近の開催日 {last_race}(直近 60 日で {len(days)} 日)')
          print(f'ooi_official の最新 race_date {last_ev}')
          if last_ev is None:
              print('MISSING ooi_official の行が 1 つも無い')
              raise SystemExit(1)
          gap = (dt.date.fromisoformat(last_race) - dt.date.fromisoformat(last_ev)).days
          behind = [d for d in days if d > last_ev]
          print(f'遅れ {gap} 日 / 取れていない開催日 {len(behind)} 日 {behind[:5]}')
          if gap >= 2:
              print('MISSING 大井公式の出来事が 2 日以上入っていない')
              print('修理= nar_fetch_raw の fetched_at が今朝 06:00 か見る(§195d pg_cron)'
                    ' → horse-health を手押し(source=nar・dry_run=false)')
              raise SystemExit(1)
          raise SystemExit(0)
          PY

  # 監査 A8(2026-09-24) 定期便の最終成功時刻(表 nar_job_heartbeat)を外から見る。どれかに当たれば赤(= 所有者へ失敗メール)
  #   ① dispatch か odds_watch か ai_last か monbetsu_calc の last_status が 'fail'(本番 DB の起動係・オッズ見張り・AI 直前便・門別の番組賞金の照合外れ §284①が自分で失敗を書いた)
  #   ⑤ monbetsu_class の note の「見込み=YYYY-MM-DD」の翌日 JST 09:00 を過ぎても新しい回が無い(§284)
  #   ② JST 09:30〜22:00 に refresh の last_ok が 70 分より古い(daily 便は 30 分おき)
  #   ③ JST 09:30 以降に ai_feat・stats の last_ok が今日でない
  #   ④ JST 10:30 以降に votes の last_ok が今日でない
  #   表がまだ無い/読めないときは警告だけで緑(本番 DB に表を当てる前でも赤にしない)。
  heartbeat:
    if: github.event.schedule != '40 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud/beat.py
          sparse-checkout-cone-mode: false
      - name: check job heartbeats
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import sys, datetime as dt
          sys.path.insert(0, 'cloud')
          import beat
          got = beat.rows()
          if got is None:
              print('::warning::nar_job_heartbeat が読めない(表がまだ無い?)= 警告だけで緑')
              raise SystemExit(0)
          now = dt.datetime.now(beat.JST); today = now.date(); hm = now.hour * 100 + now.minute
          def last_ok(job):
              r = got.get(job) or {}
              v = r.get('last_ok')
              return dt.datetime.fromisoformat(str(v).replace('Z', '+00:00')).astimezone(beat.JST) if v else None
          for job in sorted(got):
              r = got[job]
              print(f"{job:24s} ok={r.get('last_ok')} try={r.get('last_try')} status={r.get('last_status')} note={r.get('note')}")
          bad = []
          for job in ('dispatch', 'odds_watch', 'ai_last', 'monbetsu_calc'):
              if (got.get(job) or {}).get('last_status') == 'fail':
                  bad.append(f"{job} の last_status= fail(note={(got.get(job) or {}).get('note')})")
          if 930 <= hm < 2200:
              t = last_ok('refresh')
              if t is None or (now - t).total_seconds() > 70 * 60:
                  bad.append(f"refresh の最終成功が 70 分より古い({t})")
          if hm >= 930:
              for job in ('ai_feat', 'stats'):
                  t = last_ok(job)
                  if t is None or t.date() != today:
                      bad.append(f"{job} が今日まだ成功していない(最終 {t})")
          if hm >= 1030:
              t = last_ok('votes')
              if t is None or t.date() != today:
                  bad.append(f"votes が今日まだ成功していない(最終 {t})")
          import re
          m = re.search(r'見込み=(\d{4}-\d{2}-\d{2})', str((got.get('monbetsu_class') or {}).get('note') or ''))
          if m:
              exp = dt.date.fromisoformat(m.group(1))
              if now >= dt.datetime.combine(exp + dt.timedelta(days=1), dt.time(9, 0), tzinfo=beat.JST):
                  bad.append(f"門別の級別表が見込み日 {exp} を過ぎても取れていない(note={got['monbetsu_class'].get('note')})")
          for b in bad:
              print('::error::' + b)
          print('異常なし' if not bad else f'異常 {len(bad)} 件')
          raise SystemExit(1 if bad else 0)
          PY

  # 監査 D10(2026-09-24) 本番 DB の大きさ= JST のその日の最初の便で cloud/db_sizes.py を 1 回流す(catalog を読むだけ)。
  #   nar_meta 'db_sizes' の at が JST の今日なら流さない。warn がある/at が 36 時間より古い → 赤(= 所有者へ失敗メール)。
  #   閾値は db_sizes.py の先頭(仮置き)。D4 の「外から見たオッズの鮮度」は上の odds-live が既に見ている。
  db-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cloud/beat.py
            cloud/db_sizes.py
          sparse-checkout-cone-mode: false
      - name: record db sizes once a day and check thresholds
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import sys, subprocess, datetime as dt
          sys.path.insert(0, 'cloud')
          import beat
          def meta():
              got = beat._req('nar_meta?select=value&key=eq.db_sizes')
              return (got[0]['value'] if got else None) or {}
          def at_of(v):
              return beat._ts(v.get('at')) if v.get('at') else None
          now = dt.datetime.now(beat.JST)
          v = meta(); at = at_of(v)
          rc = 0
          if at is None or at.date() != now.date():
              print(f'db_sizes の最終 {at} = 今日まだ無いので流す', flush=True)
              rc = subprocess.run([sys.executable, 'cloud/db_sizes.py']).returncode
              v = meta(); at = at_of(v)
          else:
              print(f'db_sizes は今日すでに記録済み({at})= 流さない')
          bad = []
          if rc != 0:
              bad.append(f'db_sizes.py が失敗(exit {rc})')
          if at is None or (now - at).total_seconds() > 36 * 3600:
              bad.append(f'db_sizes の記録が 36 時間より古い({at})')
          for w in v.get('warn') or []:
              bad.append('DB の大きさ: ' + w)
          g = v.get('growth_per_day')
          print(f"DB {int(v.get('db_bytes') or 0) / 1024**3:.2f}GB 伸び/日 {g}")
          for t in (v.get('tables') or [])[:5]:
              print(f"  {t['name']:28s} {t['bytes'] / 1024**2:8.0f}MB {t['rows']:>10d} 行")
          for b in bad:
              print('::error::' + b)
          print('異常なし' if not bad else f'異常 {len(bad)} 件')
          raise SystemExit(1 if bad else 0)
          PY
