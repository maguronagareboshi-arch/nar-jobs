# 本体: NAR公式データの当日更新をクラウド(GitHub Actions)で回す。PC は不要。
# 2026-09-08 nar-viewer(private)から nar-jobs(public)へ移設(#529)。
# - 日次: JST 09:07〜21:37 を**30分おき**(#528 2026-09-08: 無料枠 2,000 分/月に収めるため 20 分刻みから間引き。GitHub の cron は UTC。混雑時は間引かれる=特に JST 9〜10時台。nar-watchdog が3時間超の停止を検知)
# - 月次: JST 05:30(先の日程の出馬表+前日までの確定結果)+ データルームの集計(pipeline/sql/venue_stats.sql・person_stats.sql)
# - 当日オッズ: 単複も全券種も公開リポ nar-odds-collector が 2 分おきに取る(§77 W3・#451 で本体の cloud/odds.py 段は撤去)
# - 手動: Actions タブ → nar-refresh → Run workflow(mode を選ぶ)
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY(nar-official の service_role)
#                 NAR_DB_PASSWORD(nar-official の DB パスワード。集計 SQL を psql で流すため)
name: nar-refresh

on:
  schedule:
    - cron: '7,37 0-12 * * *'   # 30 分刻み(#528)。:00/:30 は混雑で間引かれやすい実測(8/24-25 の朝連続スキップ)のため半端な分へ。17:07 の展開便は残る
    - cron: '33 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily / monthly / both'
        default: 'daily'
        type: choice
        options: [daily, monthly, both]
      pace_since:
        description: 'ペースの記録をさかのぼる開始日(YYYY-MM-DD・空なら前日ぶんだけ)'
        required: false
        default: ''

concurrency:
  group: nar-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: ${{ github.event.inputs.mode || (github.event.schedule == '33 20 * * *' && 'monthly' || 'daily') }}
  PACE_SINCE: ${{ github.event.inputs.pace_since }}

jobs:
  # 監査 A2(2026-09-24): 月次は本番 DB(pg_cron)の dispatch が本命・GitHub の schedule('33 20')は予備として残す。
  #   予備の schedule で起きたとき、今日の月次が済んでいれば(heartbeat 'stats' の last_ok が JST 今日)残りを飛ばして成功で終わる。
  #   表がまだ無い/読めないときは従来どおり走る。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud/beat.py
          sparse-checkout-cone-mode: false
      - name: skip when today's monthly run is already done
        id: g
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          S=0
          if [ "$EVENT" = "schedule" ] && [ "$MODE" = "monthly" ]; then
            T=$(python3 cloud/beat.py --today stats || echo '?')
            echo "stats の今日の成功= $T(1= 済・0= 未・?= 読めない)"
            if [ "$T" = "1" ]; then S=1; echo "今日の月次は済み= 予備の schedule は何もせず終わる"; fi
          fi
          echo "skip=$S" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # §227b(2026-09-19) 朝の月次便が 60 分で打ち切られる日が続いたので 90 分へ(公開リポ= 分の上限なし)。#520(2026-09-07) 月次便が 30 分に達して person_stats の途中で切られた(9/5 28m58s・9/6 cancelled 30m20s)。日次便は 1〜2 分なので余裕は害なし
    steps:
      - uses: actions/checkout@v4
      # 監査 A1(2026-09-24): 朝の段は「JST 09:30 前の便」ではなく「今日まだ済んでいない(heartbeat 'refresh_morning')かつ JST 09:00 以降」の便で回す。
      #   時刻だけで決めると、朝の便が月次に待たされて 09:30 を越えた日に「スキップ」で黙って 1 日抜けた(9/22)。
      #   朝の段が終わったら成否に関係なく印を書く(全段成功= ok・どれか失敗= fail で note に落ちた段名)。
      #   失敗した日は last_try から 2 時間たった便でもう一度回る(= 2 時間に 1 回まで)。表が読めないときは従来の 09:30 前に戻る。
      #   以下の段の `[ "$MORNING" = 1 ]` がこの判定(元は JST 09:30 前か)。EVENING= JST 17:00 以降。
      - name: morning or not
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          D=$(python3 cloud/beat.py --due refresh_morning 7200 || echo '?')
          if [ "$D" = "?" ]; then
            if [ $((10#$H)) -lt 930 ]; then M=1; else M=0; fi
          elif [ "$D" = "1" ] && [ $((10#$H)) -ge 900 ]; then M=1; else M=0; fi
          if [ $((10#$H)) -ge 1700 ]; then E=1; else E=0; fi
          echo "MORNING=$M" >> "$GITHUB_ENV"
          echo "EVENING=$E" >> "$GITHUB_ENV"
          echo "朝の段= $M(refresh_morning を回す番= $D・JST $H)/ 夕の段= $E"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - run: sudo apt-get install -y -qq tesseract-ocr >/dev/null   # §146 名古屋の砂厚(画像の断面)を文字認識で読む
      - name: refresh
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/refresh.py --mode "$MODE"
      # §291 チェック馬のお知らせ(web push): 取り込み(上の refresh)の直後に A= 出走が決まった / C= 結果が出た を送る。
      #   nar_push_sent に先に入れた分だけ送る(二重送信なし)。⛔secret NAR_VAPID_PRIVATE が無ければ送らず緑で抜ける。
      #   落ちても便は赤くしない(continue-on-error)・heartbeat 'push_notify'(台本の中で書く)
      - name: push notify
        if: env.MODE != 'monthly' && !cancelled()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          NAR_VAPID_PRIVATE: ${{ secrets.NAR_VAPID_PRIVATE }}
          NAR_VAPID_SUBJECT: ${{ secrets.NAR_VAPID_SUBJECT }}
        run: |
          if [ -z "$NAR_VAPID_PRIVATE" ]; then echo "NAR_VAPID_PRIVATE が無い= 送らない"; exit 0; fi
          python cloud/push_notify.py --apply
      # 共有画像(2026-09-26): 払戻の取り込み(上の refresh)の後で、確定したレースの 1200x630 PNG を公開バケット share に上げる。
      #   字(BIZ UDゴシック Bold)は cache・無ければ share_image.py が取って sha256 を照合する。同じ中身は上げ直さない。
      #   JST 06 時前の便は前日の遅い確定も拾う。⛔落ちても便は赤くしない(continue-on-error)・件数はログ・heartbeat 'share_image'
      - name: share image font cache
        if: env.MODE != 'monthly' && !cancelled()
        uses: actions/cache@v4
        with:
          path: fonts/BIZUDGothic-Bold.ttf
          key: font-bizudgothic-bold-98a528b6b638463041968783cc0f63adaf4cdc26f5398afed68bab712d1113f3
      - name: share image
        if: env.MODE != 'monthly' && !cancelled()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          RC=0
          if [ "$(TZ=Asia/Tokyo date +%H)" -lt 6 ]; then python cloud/share_image.py --upload --date "$(TZ=Asia/Tokyo date -d yesterday +%F)" || RC=1; fi
          python cloud/share_image.py --upload --date "$(TZ=Asia/Tokyo date +%F)" || RC=1
          if [ $RC = 0 ]; then python3 cloud/beat.py share_image ok; else python3 cloud/beat.py share_image fail 失敗あり; fi
          exit $RC
      # 当日オッズ(単複+全券種)は **公開リポ nar-odds-collector の Actions が 2 分おき**に取る(§77 W3・2026-09-04 #451:
      # 本体の単複段 cloud/odds.py は撤去。園田1R で 13:50/13:52/13:54 の 3 ティックと nar_race_odds の更新を実測してから外した)。
      # cloud/odds.py / cloud/odds_full.py は同一内容の正本として残す(tests が読む・公開リポの odds_tanfuku.py/odds_full.py の元)。
      # ⛔戻すとき: ここに `- name: odds` / `run: python cloud/odds.py`(if: env.MODE != 'monthly')を足すだけ。

      # 2026-09-09 base-v0 の印(cloud/marks.py)は書くのをやめた= 画面は base-v1 の 1 本(別便 nar-ai-feat.yml が書く)。
      # 2026-09-25 cloud/marks.py は git rm で撤去(失敗作の整理)。DB の base-v0 の行は残す。戻すときは git 履歴から。

      # データ鮮度の見張り(daily): 直近3時間以内に nar_races が更新されていなければ失敗させる
      # (失敗すると GitHub が所有者へ通知メールを送る=これが唯一の監視。DESIGN §21)
      - name: health check (daily / both)
        if: env.MODE != 'monthly'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime as dt
          url = os.environ['SUPABASE_URL'] + '/rest/v1/nar_races?select=updated_at&order=updated_at.desc&limit=1'
          req = urllib.request.Request(url, headers={'apikey': os.environ['SUPABASE_SERVICE_KEY'],
                                                     'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_KEY']})
          rows = json.loads(urllib.request.urlopen(req, timeout=30).read())
          last = dt.datetime.fromisoformat(rows[0]['updated_at'].replace('Z', '+00:00'))
          age = (dt.datetime.now(dt.timezone.utc) - last).total_seconds()
          print(f'nar_races last update: {last.isoformat()} ({age/60:.0f} min ago)')
          raise SystemExit(0 if age < 3 * 3600 else 1)
          PY

      # §32a 公式サイトの能検(岩手・兵庫)。差分だけ・数ページ/日
      - name: noken public (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/noken_public.py --venue all

      # §117b 門別・南関4場の能検は結果が当日〜翌日に出るので**朝の便で毎日**差分を取る(南関= 直近21日の日付総当たり
      # 1場 22〜24 本・門別= 索引+最新3日・0.7秒あけ・合計 2 分弱)。月次の --venue all にも入っているが、それは月 1 回
      - name: noken public 5 venues (morning only)
        id: am_noken5
        if: env.MODE == 'daily' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then for v in monbetsu ooi funabashi kawasaki urawa; do python cloud/noken_public.py --venue $v || echo "⚠ $v の能検が取れない(続行)"; done; else echo "5場の能検は朝の便だけ(JST $H)=スキップ"; fi

      # §45 能検組の初出走(今日+明日の出馬表×能検索引 → nar_meta 'noken_debuts')。3〜5クエリ・数秒・冪等。
      # daily でも回す=明日の出馬表は日中に入るため(⛔出馬表は翌日ぶんまでしか出ない #146)
      - name: noken debuts (daily + monthly)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python cloud/noken_debuts.py --apply
          python cloud/auction_today.py --apply || echo "⚠ 今日のオークション取引馬(auction_today)が書けない(続行)"

      # §37.4-① 能検索引(13地区 → nar_meta key='noken_index')。meta の読み15本 + ran照会 約60本・1分弱・冪等。
      # §50 #187 から daily でも回す= ran(デビュー済み)の旗を翌朝までに更新するため
      # (⛔ran は「一度付いたら戻らない」向きだけの旗なので、遅れても誤りにはならない=画面が生照会で補う)
      # 2026-09-02 分予算対策: 毎回 1 分弱かかるので **朝の便(monthly 05:33 と daily 09:07)だけ**に減らす
      - name: noken index (morning only)
        id: am_noken_index
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/noken_index.py --apply; else echo "noken index は朝の便だけ(JST $H)=スキップ"; fi

      # §139 各競馬場の主催者公式のお知らせを1か所に集めた索引(見出し・日付・公式リンクだけ・本文は取らない)。
      # ⛔**朝の便だけ**= 公式サイトを1日に何度も叩かない(笠松は番号を辿るので1回あたり30回ほど出す)。
      # ⛔**落ちても続行**(|| echo)= 索引は付け足しの機能なので、これで朝の便を止めない。
      # 新しい便は作らない(Actions の分予算。ここに相乗りで実測10秒ほど)。
      - name: official news (morning only)
        id: am_official_news
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/official_news.py --apply || echo "⚠ 各場のお知らせが取れない(続行)"; else echo "official news は朝の便だけ(JST $H)=スキップ"; fi

      # §140 段 1 主催者の発表を読んで記事の下書きを作る(#542)。official news の直後・**朝の便だけ**。

      # §79 P1 馬ごとの格組・収得賞金(全15場・公式 keiba.go.jp)。番号=出馬表 1レース1本・馬ページ 1頭1本(0.5秒)。
      # 前日に走った馬(結果が入った馬)と番号の無い馬だけ=日次 数百本・数分。**朝の便だけ**(分予算。noken index と同じ門)
      - name: sand depth (daily + monthly)   # §146 高知・名古屋・笠松の砂厚の測定表を溜める(高知は開催日 11:30 頃に出る= 便ごとに見る)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/sand_depth.py --apply || echo "⚠ 砂厚が取れない(続行)"

      - name: horse ledger (morning only)
        id: am_horse_ledger
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/horse_ledger.py --apply --max-horses 1200; else echo "horse ledger は朝の便だけ(JST $H)=スキップ"; fi

      # 監査 #21 案 乙: 同名表 nar_meta 'horse_homonyms' の軽い追記(昨日〜明日の出走馬 × nar_horse_profiles の生年)。
      # horse ledger(③ profiles.code の埋め)の直後・朝の便だけ。表がまだ無ければ警告して 0。⛔落ちても続行
      # 全期間から作り直すのは手で回す便 horse-homonyms.yml
      - name: horse homonyms (morning only)
        id: am_horse_homonyms
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/horse_homonyms.py --apply || echo "⚠ 同名表の追記に失敗(続行)"; else echo "horse homonyms は朝の便だけ(JST $H)=スキップ"; fi

      # §38 1-C 南関東4場の「格」「格付ポイント」(主催者 nankankeiba の馬ページ・1.5秒/本)。直近2日に走った馬だけ=
      # 日次 100〜300 本・数分。**朝の便だけ**(分予算)。他場PCの fetch_nankan_points.py(大井だけ・chihou_meta)の置き換え
      - name: nankan points (morning only)
        id: am_nankan_points
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/nankan_points.py --apply --days 2 --max-horses 400; else echo "nankan points は朝の便だけ(JST $H)=スキップ"; fi
          # §196b 第 2 段= 走った馬の格付ポイントの履歴(表 nar_nankan_point_hist)。nankan_points の直後・朝の便だけ
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/nankan_hist.py --apply --days 3; fi

      # §79 P3 場ごとの「番組賞金(当サイトの計算)」と「あと◯」を台帳の calc 列へ(通信は DB だけ・数秒)。
      # 線の表は class.js を node で読む(tests/class_const_dump.mjs)。検算= docs/s79_p3_verify_20260903.md
      - name: class calc (morning only)
        id: am_class_calc
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/class_calc.py --apply --hist-days 3 --prefix kochi && python cloud/class_calc.py --apply --hist-days 3 --prefix obihiro && python cloud/class_calc.py --apply --hist-days 3 --prefix saga && python cloud/class_calc.py --apply --hist-days 3 --prefix tokai && python cloud/class_calc.py --apply --hist-days 3 --prefix hyogo; else echo "class calc は朝の便だけ(JST $H)=スキップ"; fi

      # §288 佐賀の降級の目安(翌1月の減額の見込み)を表 nar_saga_demotion へ(cloud/saga_demotion.py)。class calc の後・朝の便だけ。
      # heartbeat 'saga_demotion'。⛔落ちても続行(|| echo)= 便を止めない
      - name: saga demotion (morning only)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/saga_demotion.py --apply --out "$RUNNER_TEMP/saga_demotion.csv" || echo "::warning::佐賀の降級の目安が作れない(続行)"; else echo "saga demotion は朝の便だけ(JST $H)=スキップ"; fi

      # §284① 門別の番組賞金と級= 公式の最新回を起点に前日までの走を自前で加算(nar_meta 'monbetsu_class_calc')。
      # heartbeat 'monbetsu_calc'。⛔落ちても続行(|| echo)= 便を止めない
      - name: monbetsu calc (morning only)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/class_monbetsu_calc.py --apply || echo "::warning::門別の番組賞金(自前の加算)が作れない(続行)"; else echo "monbetsu calc は朝の便だけ(JST $H)=スキップ"; fi

      # §54.1 P1 券種別の総票数・返還票数(楽天 race_dividend・1日1場1リクエスト)。
      # 前日までの取りこぼしは --days 3 の窓が自己修復。未確定の日は書かず翌日また試す
      - name: rakuten sales (daily + monthly)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/rakuten_sales.py --days 3 --apply

      # §157 段 3(2026-09-12): 高知の結果の自己修復(旧 DB keiba_* へ Worker 経由で保存)は外した= 高知の結果は 15 場の公式取得(nar_runs)に一本化

      # §120 高知のレース後コメント(主催者公式 www.keiba.or.jp)。結果の確定した(日,R)だけ
      # 1 レース 1 GET(0.7 秒あけ)・既に行のある(日,R)は開かない・未掲載は記録しない(次の便でまた見る)。
      # ⚠**この段は Opus の提案**(§120)= Fable が確かめること。⛔先に
      #   pipeline/sql/nar_race_comments_20260907.sql を流すこと(表が無いと exit 2 で止まる)。
      - name: kochi comments (daily)
        if: env.MODE != 'monthly' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/kochi_comments.py --apply

      # §54.3-bc 移籍・在籍変化(転入・転厩=直近7日窓の自己修復 / 馬主変更=日次スナップショット差分)。
      # 毎朝1回で足りるので monthly 便(05:33 JST=このリポジトリの日次集計の置き場)に置く。
      # 検出は DB 側の1文(window 関数・実測2秒)= pg8000 で流す(SUPABASE_DB_PASSWORD)
      - name: horse changes (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
        run: python cloud/horse_changes.py --apply

      # §126 乗り替わり分析の集計表(全 15 場・DB 側の refresh_nar_jc() で全部作り直し= 実測 181 秒)。
      #   monthly 便(05:33 JST)に 1 日 1 回。画面は集計表を anon で読むだけ。
      - name: jockey change stats (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
        run: python cloud/jockey_change.py --apply

      # §38 1-E 門別の級別表は §284 で専用の便 monbetsu-class.yml へ移した(見込み日だけ取りに行く・二重に動かさない)

      # §54.6 せり市場の結果(sale_results.py → auction_sales)の定期実行は 2026-09-26 に止めた(案 A)。
      #   市場の取引は表 sale_listings 1 本(便 sale-listings.yml)。auction_sales は楽天・SAT 専用に戻す。台本と既存行は残す(画面側で source を絞る)

      # §48 K-1b 馬場差の全15場一括計算(日×場の中央値・帯広ば除外)
      # 2026-09-22 S1 標準の窓は季節版(同じ暦±45日×3年)が既定= 引数は要らない(--baseline で切替)
      # 2026-09-05 ユーザーFB「最近の馬場の時計が出ていない日がある」= monthly だけだったのを 朝の便(JST 09:30 前)でも回す(手元 24 秒)
      - name: baba diff (monthly + morning)
        id: am_baba_diff
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then python cloud/baba.py --apply; else echo "baba diff は monthly と朝の便だけ(JST $H)=スキップ"; fi

      # §100 馬場傾向(時計=baba_diff・前後=1角順位×着順ρ・内外=枠×着順ρ)。朝の便は 90 日組み直し、日中の便は当日だけ
      - name: baba trend
        id: am_baba_trend
        if: env.MODE != 'monthly'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then python cloud/baba_trend.py --apply; else python cloud/baba_trend.py --apply --today; fi

      # §103 コース別データ(場×距離の枠番・序盤の位置・逃げ馬)。前日までの過去1年の数なので朝の便だけ
      # (手元の実測= 14場ぶんで 32 秒・要求 187 回)
      - name: course stats (morning only)
        id: am_course_stats
        if: env.MODE != 'monthly' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then python cloud/course_stats.py --apply; else echo "course stats は朝の便だけ(JST $H)=スキップ"; fi

      # §118 データの状態= 取り込めたかを行数で数えて nar_meta coverage に 1 枚(朝の便の最後・前段が落ちても数える)
      - name: coverage (morning only)
        id: am_coverage
        if: env.MODE != 'monthly' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then python cloud/coverage.py --apply && python3 cloud/beat.py coverage ok; else echo "coverage は朝の便だけ(JST $H)=スキップ"; fi

      # §46.2 先の開催日程(公式の月別開催日程・当月+先2か月・3リクエスト)。/calendar と週間日程が読む
      - name: kaisai schedule (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/convene.py --apply

      # 監査 A7(2026-09-24) 集計 SQL 6 本(venue/person/ai_record/race_level/graded/big_payouts)は本番 DB で流すのをやめ、
      #   下の job stats_check(nar-stats.yml・mode=apply= Actions 内の Postgres で計算して差分だけ本番へ)に移した。heartbeat 'stats' もそちらで書く。
      # §258(2026-09-23): 単複 2分刻み nar_odds_ticks の間引き(odds_ticks_retention.sql= 60 日超を 1 レース 9 点)は外した。
      # 60 日超は daily 朝の便の odds archive(cloud/odds_archive.py)が Storage へ全点を書き出し→照合してから、同じ規則で 9 点に間引く
      # (先に間引くと書き出す前に 2 分刻みが消える= 後で研究できない)。
      # 戻し方(書き出しをやめて SQL の間引きに戻すときだけ): 下の行の # を外し、odds_archive.py の TABLE_ALIAS "all" から nar_odds_ticks を抜く。
      # psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres -v ON_ERROR_STOP=1 -X -f pipeline/sql/odds_ticks_retention.sql | tail -n 3
      # 監査 #28(2026-09-23): nar_odds_full_ticks の間引き(odds_full_ticks_retention.sql)は外した。
      # 60 日超は daily 朝の便の odds archive(cloud/odds_archive.py)が Storage へ書き出してから消す(先に間引くと書き出す前に消える)

      # §238a 派生表 nar_run_facts(通過順の順位・脚質・前半3F・発走直前の単勝を 1 頭 1 行で先に焼く)。
      # ⛔**結果が確定した後**の段= 当日と前日ぶんを毎便 upsert(前日は結果が入ってから焼き直す・冪等)。
      # ⛔落ちても続行(|| echo)= 読み手が付くまでは付け足しの表なので、これで便を止めない。
      # ⛔先に pipeline/sql/run_facts_20260921.sql を流すこと(表が無いと HTTP404 で 1 を返す)。
      # 遡り(2025-09〜)は Actions では回さず手押し= python cloud/run_facts.py --apply --from … --to …
      - name: run facts (daily + monthly)
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/run_facts.py --apply || echo "⚠ 派生表 nar_run_facts が焼けない(続行)"

      # §238c 網羅表(場 × 年月の枡= 何レース入っていて、どの項目が何 % 埋まっているか)を
      # nar_meta 'coverage:v1'(索引)と 'coverage:v1:YYYY' に焼く。画面 /coverage が読む。
      # ⛔派生表 nar_run_facts の後に置く(同じ朝の値を数えるため)。朝の便だけ・直近 2 か月だけ数え直す。
      # ⛔落ちても続行(|| echo)= 数えるだけの表なので、これで便を止めない。
      # 全期間の焼き直しは coverage-backfill.yml(手押し)。
      - name: coverage matrix (morning only)
        id: am_coverage_matrix
        if: env.MODE != 'monthly' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then
            python cloud/coverage_matrix.py --apply || echo "⚠ 網羅表が焼けない(続行)"
          else
            echo "coverage matrix は朝の便だけ(JST $H)=スキップ"
          fi

      # §239a 分析タブ(南関)の事実 nar_karte_facts(1 頭 1 行・発走前の値だけ)。JST の今日と明日の出走表ぶんを upsert(冪等)。
      # 設計= 「前日の出走表が出た後と当日朝」= 朝の便(JST 09:30 前・monthly 05:33 を含む)と 17:00 以降の便だけ。
      # ⛔落ちても続行(|| echo)。⛔先に pipeline/sql/karte_facts_20260922.sql を流すこと(表が無いと HTTP404 で 1 を返す)。
      # 出遅れの割合表(nar_meta karte:late_next:v1)は手動便 karte-facts(late_table)で作る= 無い間は late_next_pct が空。
      # 夕方(17:00 以降)は先に**明日**の nar_run_facts を焼く(run facts 段は今日と前日だけ= 明日の脚質が空になるため)。
      #   脚質は過去走だけで決まる= 発走前の値として正しい。着順・通過の入った行は当日と翌日の run facts 段が上書きする。
      - name: karte facts (morning + evening)
        id: am_karte_facts
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ] || [ $((10#$H)) -ge 1700 ]; then
            if [ $((10#$H)) -ge 1700 ]; then T=$(TZ=Asia/Tokyo date -d tomorrow +%F); python cloud/run_facts.py --apply --from "$T" --to "$T" || echo "⚠ 明日($T)の nar_run_facts が焼けない(続行)"; fi
            python cloud/karte_facts.py --apply || echo "⚠ 分析タブの事実 nar_karte_facts が焼けない(続行)"
          else echo "karte facts は朝と 17:00 以降の便だけ(JST $H)=スキップ"; fi

      # §99 展開の見立て(今日+明日の出馬表)。朝の便(09:30 前)と 17:07 の便(明日の出馬表が前日夕に出る)だけ
      # ⛔§238a2(2026-09-22)でこの段は **run facts / karte facts の後ろへ移した**。tenkai は
      #   通過順も脚質も派生表 nar_run_facts から読むだけになったので、今日ぶん(run facts 段)と
      #   明日ぶん(karte facts 段の 17:00 以降)が焼けた**後**でないと型が空になる。
      - name: tenkai (morning + 17:07)
        id: am_tenkai
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ] || { [ $((10#$H)) -ge 1700 ] && [ $((10#$H)) -lt 1730 ]; }; then python cloud/tenkai.py --apply; else echo "tenkai は朝と 17:07 の便だけ(JST $H)=スキップ"; fi
          if [ -n "$PACE_SINCE" ] || [ "$MODE" != "daily" ] || [ "$MORNING" = 1 ]; then psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres -v ON_ERROR_STOP=1 -X -f pipeline/sql/nar_race_pace_20260920.sql | tail -n 2 && python cloud/tenkai.py --apply --pace-log ${PACE_SINCE:+--since "$PACE_SINCE"}; else echo "pace log は朝の便だけ(JST $H)=スキップ"; fi

      # 再生不能データ(AI印の凍結履歴・当日オッズ・成績)の月次バックアップ。
      # 監査 A3(2026-09-24) 公開 repo の成果物をやめ、Storage の非公開バケット odds-archive の backup/YYYY-MM-DD/<表>.csv.gz へ置く。
      #   同じ段で backup/ の 30 日より古い日付フォルダを消す。上げ損ねたら段を赤くする(無言で抜けない)。
      #   落とし方= Supabase の Storage 画面 → odds-archive → backup
      - name: backup irreplaceables (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -o pipefail
          mkdir -p backup
          for t in nar_ai_marks nar_race_odds nar_ai_record; do
            psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres -X               -c "\copy (select * from public.$t) to 'backup/$t.csv' csv header"
          done
          gzip backup/*.csv && ls -la backup/
      - name: upload backup to storage (monthly only)
        if: env.MODE != 'daily' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python cloud/storage_put.py put --prefix "backup/$(TZ=Asia/Tokyo date +%F)/" backup/*.csv.gz
          python cloud/storage_put.py prune --root backup/ --days 30

      # 監査 #28(2026-09-23 案C) 全券種オッズの刻み nar_odds_full_ticks の 60 日超を 1 日 1 ファイル
      # (Storage 非公開バケット odds-archive)へ書き出し→取り直して照合→一致した日だけ DB から消す。1 回 3 日まで。
      # §258(2026-09-23) 続けて単複 2分刻み nar_odds_ticks も同じく書き出し→照合→1 レース 9 点だけ残して他を消す
      # (odds_ticks_retention.sql と同じ規則・上の monthly 段の SQL 間引きは止めた)。上限 3 日は表ごと。
      # ⛔最後の段に置く= 失敗(rc 1)しても他の段を止めない。照合が合わなければ消さずに落ちる(失敗メールで気づく)
      - name: odds archive (morning only)
        id: am_odds_archive
        if: env.MODE != 'monthly' && !cancelled()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$MORNING" = 1 ]; then python cloud/odds_archive.py --max-days 3; else echo "odds archive は朝の便だけ(JST $H)=スキップ"; fi

      # 監査 A8(2026-09-24) 最終成功時刻(表 nar_job_heartbeat)。外の見張り nar-watchdog と画面が読む。⛔表が無くても落ちない
      #   refresh= daily の成功ごと / stats= nar-stats(apply)が書く / refresh_evening= 17 時以降の便の成功(refresh_morning は下の段)
      - name: heartbeat ok
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$MODE" != "monthly" ]; then python3 cloud/beat.py refresh ok "JST $(TZ=Asia/Tokyo date +%H:%M)"; fi
          if [ "$MODE" != "monthly" ] && [ "$EVENING" = 1 ]; then python3 cloud/beat.py refresh_evening ok; fi
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$MODE" != "monthly" ]; then python3 cloud/beat.py refresh fail 失敗; fi
          if [ "$MODE" != "monthly" ] && [ "$EVENING" = 1 ]; then python3 cloud/beat.py refresh_evening fail 失敗; fi
      # 監査 A1(2026-09-24) 朝の段を回した便は成否に関係なく refresh_morning を書く(全段成功= ok・どれか失敗= fail で note に段名)
      #   段は id が am_ で始まるもの。⛔表が無くても落ちない
      - name: heartbeat morning
        if: always() && env.MORNING == '1' && env.MODE != 'monthly'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          BAD=$(python3 -c "import json,os; s=json.loads(os.environ['STEPS']); print(' '.join(k[3:] for k,v in s.items() if k.startswith('am_') and v.get('outcome')=='failure'))")
          if [ -z "$BAD" ]; then python3 cloud/beat.py refresh_morning ok; else python3 cloud/beat.py refresh_morning fail "落ちた段 $BAD"; fi

  # 監査 A7(2026-09-24) 集計は Actions 内の Postgres で作る便 nar-stats(mode=apply= 差分だけ本番へ・heartbeat 'stats' もここ)。
  stats_check:
    needs: [gate, refresh]
    # #478 と同じ= 前段が落ちても集計は流す(集計は前日までの確定結果で足りる)
    if: "!cancelled() && needs.gate.outputs.skip != '1' && (github.event.inputs.mode || (github.event.schedule == '33 20 * * *' && 'monthly' || 'daily')) != 'daily'"
    uses: ./.github/workflows/nar-stats.yml
    with:
      mode: apply
    secrets: inherit
