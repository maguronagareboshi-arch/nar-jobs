# ばんえい(帯広)第 3 版(model='banei-3')を書く便(2026-10-28・v3 の out/banei_v3_deploy_plan.md・ばんえい 決め 6)。
#   オッズ・人気を見ず、公式の帯広の成績 + 競馬ブックの区間タイム・通過順だけで 3 着内率と勝つ率を出す。
# 段: ① 競馬ブック帯広の前の開催日の成績 → 表 nar_kb_banei(DB に無い日だけ)
#     ② 前の日までで学ぶ(第 2 版の木・並び読み 3 種・平らな模型)→ 成果物 banei-v3-models-DAY(暗号化)
#     ②b 朝の版(学んだ便で 1 回・体重 = 前走・1R の水分と天候 = 前の開催日の 1R)→ nar_ai_marks(banei-3・morning・凍結)
#     ③ 直前の周(10 分おき): 当日の行を取り直し・公式の当日 ZIP の体重と 1R の水分を重ね・当てて書く
# 起動 = pg_cron の dispatch(ops/banei_v3_setup.sql): 07:20 JST mode=fit / 11:40 JST mode=loop(〜17:10)/ 17:15 JST mode=loop(〜21:00)。
#   帯広の開催が無い日は最初の段で終わる。loop で今日の模型が見つからなければ、その便の中で ①② からやり直す。
# ⛔本番への書き込みは nar_ai_marks(model='banei-3', timing='last' と 'morning')と nar_kb_banei の REST upsert だけ。SQL は流さない。
#   書かない日(前の開催日の競馬ブックが無い・1R の水分が無い・学びが落ちた)は帯広の印が無い(2026-10-29 から base-v1 は帯広を書かない)。
#   画面に出すかはサイトの旗で決める。それまでは見えない。
# 固定ファイル = 暗号化リリース banei-v3-frozen-20261030(KDSCOPE 2005〜2013 の帯広・競馬ブック帯広 2017-02〜2026-10-26・
#   第 2 版の外した予想 〜2026-10-05・第 2 版の列と学びの決め)。戻すときはこの yml を消す(他の便は触っていない)。
#   2026-10-29 から 20261029 = 同じ中身 + banei_kb/banei_noken.json(第 4 版の能検の重み b・ばんえい 決め 8 例外採用・毎年 9 月に学び直す)。
#   2026-10-30 から 20261030 = 20261029 と同じ中身 + banei_kb/banei_p1.json(勝つ率の係数 b1・p1 = exp(b1 × z) の割合)。
name: banei-v3

on:
  workflow_dispatch:
    inputs:
      date:
        description: '予想する日(空= JST 今日)。例 2026-10-31'
        required: false
        default: ''
      mode:
        description: 'fit = ①② だけ / loop = 模型を取って ③ を回す(無ければ ①② から)/ once = ③ を 1 周だけ(試し・過ぎた日でも)'
        required: false
        default: 'loop'
      write:
        description: '本番 nar_ai_marks(banei-3・last)と nar_kb_banei に書く(yes/no)'
        required: false
        default: 'no'
      until:
        description: 'loop を止める JST の時刻(空 = 周の始めから 5 時間か 21:00 の早い方)。例 13:30'
        required: false
        default: ''

concurrency:
  group: banei-v3${{ github.ref_name != 'master' && format('-{0}', github.ref_name) || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read               # 同じ日の前の便の成果物(模型)を取るため

jobs:
  banei:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
      BANEI_V3: ${{ github.workspace }}/work
      BANEI_THREADS: '4'
      BANEI_TREE_THREADS: '4'
      WRITE: ${{ github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 手元の通しと同じ版に固定(pandas 3.x などで材料が変わらないように)
      - name: install python packages (手元と同じ版)
        run: |
          pip install -q "pandas==2.2.3" "numpy==1.26.4" "pyarrow==25.0.1" "lightgbm==4.7.0" requests beautifulsoup4 lxml
          pip install -q "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu

      - name: day
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            echo "$IN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "date は YYYY-MM-DD で"; exit 1; }
            DAY="$IN_DATE"
          else
            DAY=$(TZ=Asia/Tokyo date +%F)
          fi
          N=$(python -X utf8 -c "import sys; sys.path.insert(0,'pipeline/ai/banei'); import bn_kb, urllib.parse as u; print(len(bn_kb.rest('/rest/v1/nar_races?select=race_no&track=eq.'+u.quote('帯広ば')+'&race_date=eq.$DAY&limit=50')))")
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "races=$N" >> "$GITHUB_OUTPUT"
          echo "day=$DAY 帯広のレース $N 本 mode=${{ github.event.inputs.mode }} write=$WRITE"
          [ "$N" -gt 0 ] || echo "::notice::$DAY は帯広の開催なし = 何もしない"

      - name: download frozen tables (banei-v3-frozen-20261030)
        if: steps.d.outputs.races != '0'
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          : "${V3_ASSET_KEY:?secrets.V3_ASSET_KEY が無い}"
          mkdir -p in work
          for i in 1 2 3; do
            gh release download banei-v3-frozen-20261030 -p 'banei_v3_frozen.tar.gz.enc' -D in --clobber && break
            [ "$i" = 3 ] && { echo "::error::⛔ 固めた表(banei-v3-frozen-20261030)を 3 回取れなかった"; exit 1; }
            sleep 20
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/banei_v3_frozen.tar.gz.enc | tar -C work -xzf -
          rm -f in/banei_v3_frozen.tar.gz.enc
          for f in banei_kb/kd_banei_runs.parquet banei_kb/kb_runs_frozen.parquet banei_kb/feat_v1_cols.json banei_kb/feat_v2_cols.json \
                   banei_kb/banei_v2_lock.json banei_kb/prod/v2_oof.parquet banei_kb/banei_noken.json banei_kb/banei_p1.json; do
            [ -s "work/$f" ] || { echo "::error::⛔ 固めた表に $f が無い"; exit 1; }
          done
          ls -lR work | head -30

      # ① 前の開催日の競馬ブック(DB に無い日だけ)。⛔取れない日は書かない = ② が「前の開催日の競馬ブックが無い」で止まる
      - name: keibabook banei results
        if: steps.d.outputs.races != '0'
        continue-on-error: true
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_DATA_DIR: /tmp/kbdata
        run: |
          if [ "$WRITE" = "yes" ]; then P=--push; else P=; fi
          python -X utf8 pipeline/ai/banei/bn_kb.py fetch "${{ steps.d.outputs.day }}" $P

      # ② 模型: loop は同じ日の前の便の成果物を使う。無ければ(と mode=fit は)ここで学ぶ
      - name: models (artifact of an earlier run today, or fit)
        id: m
        if: steps.d.outputs.races != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.d.outputs.day }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -o pipefail
          mkdir -p models
          GOT=
          if [ "$MODE" != "fit" ]; then
            for L in $(gh run list -R "$GITHUB_REPOSITORY" -w banei-v3.yml -s success -L 10 --json databaseId --jq '.[].databaseId'); do
              if gh run download "$L" -R "$GITHUB_REPOSITORY" -n "banei-v3-models-$DAY" -D modeldl 2>/dev/null; then
                bash ops/artifact_seal.sh unseal modeldl && cp -r modeldl/. models/ && GOT=$L && break
              fi
            done
          fi
          if [ -n "$GOT" ]; then
            echo "模型 = run $GOT の成果物"; echo "fitted=0" >> "$GITHUB_OUTPUT"
          else
            python -X utf8 -W ignore pipeline/ai/banei/banei_v3.py fit "$DAY" models 2>&1 | tee fit_log.txt
            echo "fitted=1" >> "$GITHUB_OUTPUT"
          fi
          cat models/info.json

      - name: seal models
        if: steps.d.outputs.races != '0' && steps.m.outputs.fitted == '1'
        run: bash ops/artifact_seal.sh seal models sealed/banei_v3_models.tar.gz.enc

      - uses: actions/upload-artifact@v4
        if: steps.d.outputs.races != '0' && steps.m.outputs.fitted == '1'
        with:
          name: banei-v3-models-${{ steps.d.outputs.day }}
          path: sealed/
          retention-days: 3
          if-no-files-found: error

      # ②b 朝の版(学んだ便で 1 回): 体重 = 前走・1R の水分と天候 = 前の開催日の 1R で当て、timing='morning' で書く(凍結 = 既にある行は触らない)。
      #     ⛔落ちても ③ は回す
      - name: predict morning (once, after fit)
        if: steps.d.outputs.races != '0' && steps.m.outputs.fitted == '1'
        continue-on-error: true
        env:
          DAY: ${{ steps.d.outputs.day }}
        run: |
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          python -X utf8 -W ignore pipeline/ai/banei/banei_v3.py morning "$DAY" models $W

      # ③ 直前の周。⛔1 周が落ちても周は続ける(書けなかったレースは朝の版の印が残る)
      - name: predict last every 10 minutes
        if: steps.d.outputs.races != '0' && github.event.inputs.mode != 'fit'
        env:
          DAY: ${{ steps.d.outputs.day }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          START=$(date +%s)
          TODAY=$(TZ=Asia/Tokyo date +%F)
          END_DEF=$((START + 300*60))
          END_21=$(TZ=Asia/Tokyo date -d "$TODAY 21:00" +%s)
          END=$(( END_DEF < END_21 ? END_DEF : END_21 ))
          if [ -n "$UNTIL" ]; then END=$(TZ=Asia/Tokyo date -d "$TODAY $UNTIL" +%s); fi
          if [ "${{ github.event.inputs.mode }}" = "once" ]; then END=$((START + 1)); fi
          n=0
          while [ "$n" -eq 0 ] || [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            echo "::group::round $n $(TZ=Asia/Tokyo date +%T)"
            python -X utf8 -W ignore pipeline/ai/banei/banei_v3.py predict "$DAY" models $W || echo "round $n: 失敗(周は続ける)"
            echo "::endgroup::"
            [ "$(date +%s)" -lt "$END" ] || break
            sleep 600
          done
          echo "周 $n 回"
