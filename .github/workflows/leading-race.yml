# リーディング争い(2026-10-26)。今年の 1 着を日ごとに数え、全国と地区ごとの上位 10 人の日ごとの勝ち数を
# 公開バケット cond-stats の v1/leading-race.json へ上げる毎朝の便(画面 nar-viewer /leading/race が読む)。
# 台本 cloud/leading_race.py。出所= nar_runs の finish=1・残り開催日= nar_meta kaisai_schedule。
# ⛔本番 DB では REST の単純 select だけ。書くのは Storage の cond-stats/v1/leading-race.json だけ(DB に書かない)。
# 今年の 1 着が 0 件なら上げずに終わる(前の版を残す)。
# 既定= 毎朝 JST 05:50(= UTC 20:50)。前日分まで数える。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: leading-race
on:
  schedule:
    - cron: '50 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (no upload)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: leading-race
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s tests -p "test_leading_race.py"
      - name: leading race
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            python3 cloud/leading_race.py --dry-run --out "$RUNNER_TEMP/lr/leading-race.json"
            ls -l "$RUNNER_TEMP/lr"
          else
            python3 cloud/leading_race.py --apply
            # 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
            python3 cloud/beat.py leading_race ok
          fi

      # 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py leading_race fail 失敗
