# 条件で集計 /stats(2026-10-15・ユーザー了承済み見本 v3)の明細ファイルを作り、公開バケット share の cond-stats/v1/ へ上げる毎朝の便。
# 台本 cloud/cond_stats.py。約束の正本= nar-site research/site-boost-20261015/SPEC-condstats.md。
# ⛔本番 DB では REST の単純 select だけ(場ごと)。書くのは Storage の share だけ(DB に書かない・バケットは既存)。
# 既定= 毎朝 JST 05:40(= UTC 20:40)。前日までの 1 年・3 年。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: cond-stats
on:
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (no upload)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cond-stats
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s tests -p "test_cond_stats.py"
      - name: cond stats
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            python3 cloud/cond_stats.py --dry-run --out "$RUNNER_TEMP/cond"
            ls -l "$RUNNER_TEMP/cond"
          else
            python3 cloud/cond_stats.py --apply
            # 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
            python3 cloud/beat.py cond_stats ok
          fi

      # 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py cond_stats fail 失敗
