# 一回きり: 緊急 issue の試し(持ち主に試しのメールが 1 通届くか)。次の commit で消す。
name: emergency-test
on:
  push:
    branches: [emergency-mail-1117]
    paths: ['.github/workflows/emergency-test.yml']
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: open and close one test issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/emergency_issue.py --test
