# 南関 AI 土台の作り直し(nankan-ai research 40・台帳 #70 イ)用に、2014-01〜2022-10 の古い記録を 1 回だけ写す便。
#
# ここでやること= 本番から 3 表の古い区画(archive)を **読むだけ**で CSV に写し、gzip して成果物(artifact)で受け取る。
#   ⛔本番への書き込みは 0。流すのは `\copy (select …) to` だけ。
#   ⛔1 表ずつ順に(並列にしない)。絞り込みは where だけ(race_date < '2022-11-01' = archive 区画だけを読む・帯広は除く)。
#   ⛔重い計算は一切しない(group by も窓も無し)。
#   読み量の見込み(9/23 pg_class): nar_runs 326MB・nar_races 98MB・nar_run_facts 383MB。
#   cron は 1 回だけのため(2026-09-24 01:17 JST)。年の見張りで 2027 年以降は何もしない。済んだらこの便ごと消す。
name: nankan-copy-archive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 23 9 *'    # 2026-09-24 01:17 JST(便の少ない時間帯)

concurrency:
  group: nankan-copy-archive-oneshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
      PGSSLMODE: require
      PROD_HOST: aws-0-ap-northeast-1.pooler.supabase.com
      PROD_PORT: '5432'
      PROD_USER: postgres.qgsnsdjvzzeazbazjlwa
      PROD_DB: postgres
    steps:
      - name: year guard
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "2026 年以外の schedule は何もしない"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: copy nar_races archive
        if: steps.guard.outputs.run == 'yes'
        run: |
          mkdir -p out
          psql -h "$PROD_HOST" -p "$PROD_PORT" -U "$PROD_USER" -d "$PROD_DB" -v ON_ERROR_STOP=1 -X <<'SQL'
          set statement_timeout = '30min';
          \copy (select track, race_date, race_no, post_time, race_name, surface, direction, distance_m, weather, going, field_size, condition, prize_yen, race_last4f, race_last3f, furlongs, corners, source, source_snapshot_hash, updated_at, race_kind, cancelled, cancel_note, nankan from public.nar_races where race_date < '2022-11-01' and track not like '帯広%') to 'out/nar_races_archive.csv' with (format csv, header)
          SQL

      - name: copy nar_runs archive
        if: steps.guard.outputs.run == 'yes'
        run: |
          psql -h "$PROD_HOST" -p "$PROD_PORT" -U "$PROD_USER" -d "$PROD_DB" -v ON_ERROR_STOP=1 -X <<'SQL'
          set statement_timeout = '30min';
          \copy (select track, race_date, race_no, runner_number, gate, horse_name, sex, age, jockey, trainer, carried_weight, body_weight, body_weight_change, finish, finish_note, time_raw, time_sec, margin, last3f, popularity, updated_at, birth_date, trainer_area, weight_mark from public.nar_runs where race_date < '2022-11-01' and track not like '帯広%') to 'out/nar_runs_archive.csv' with (format csv, header)
          SQL

      - name: copy nar_run_facts archive
        if: steps.guard.outputs.run == 'yes'
        run: |
          psql -h "$PROD_HOST" -p "$PROD_PORT" -U "$PROD_USER" -d "$PROD_DB" -v ON_ERROR_STOP=1 -X <<'SQL'
          set statement_timeout = '30min';
          \copy (select race_date, track, race_no, umaban, horse_key, horse_name, c1, n1, c2, n2, c3, n3, c4, n4, style, style_p, style_n, first3f, first3f_src, last3f, win_odds_close, src, computed_at from public.nar_run_facts where race_date < '2022-11-01' and track not like '帯広%') to 'out/nar_run_facts_archive.csv' with (format csv, header)
          SQL

      - name: gzip csv
        if: always() && steps.guard.outputs.run == 'yes'
        run: |
          ls -l out
          gzip -6 out/*.csv
          ls -l out
          du -sh out

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'yes'
        with:
          name: nankan-copy-archive
          path: out/
          retention-days: 7
          if-no-files-found: warn
