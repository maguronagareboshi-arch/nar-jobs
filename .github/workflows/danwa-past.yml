# 2026-11-09 厩舎の話(nar_kb_danwa)の過去分の取り直し(cloud/kb/danwa_past.py)。手で回すだけ。調教は取らない。
#   済み(その日の 1R の行がある日)は飛ばすので、落ちたら同じ入力で再実行すれば続きから。
#   max_days=1 + oldest_first=1 は古い方の 1 開催日だけの試し。
# 必要な Secrets: KEIBABOOK_LOGIN_ID / KEIBABOOK_PASSWORD / NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: danwa-past
on:
  workflow_dispatch:
    inputs:
      track:
        description: '場(川崎・浦和・門別など)'
        required: true
      from:
        description: 'はじめの日 YYYY-MM-DD'
        required: true
      to:
        description: 'おわりの日 YYYY-MM-DD'
        required: true
      max_days:
        description: '0= 全部・1= 試し'
        required: true
        default: '0'
      oldest_first:
        description: '1= 古い日から・0= 新しい日から'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']
permissions:
  contents: read
concurrency:
  group: danwa-past-${{ github.event.inputs.track }}
  cancel-in-progress: false
env:
  TZ: Asia/Tokyo
  KB_DATA_DIR: /tmp/kbdata
  PYTHONUNBUFFERED: '1'
jobs:
  past:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3
      - name: danwa past
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_RELAY_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}  # 競馬ブックが海外を断る間の東京の中継(cloud/kb/kb_relay.py)
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          TRACK: ${{ github.event.inputs.track }}
          D0: ${{ github.event.inputs.from }}
          D1: ${{ github.event.inputs.to }}
          MAXD: ${{ github.event.inputs.max_days }}
          OLD: ${{ github.event.inputs.oldest_first }}
        run: |
          O=""
          if [ "$OLD" = "1" ]; then O="--oldest-first"; fi
          python cloud/kb/danwa_past.py --track "$TRACK" --from "$D0" --to "$D1" --push --max-days "$MAXD" $O --budget-min 330
