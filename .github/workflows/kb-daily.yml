# 競馬ブックの 2 段(PC タスク daily_update.py の「馬具 6場 成績→馬具 投入」と「中央戦績」)をクラウドへ移す(2026-09-29)。
# 定時(2026-09-30〜)= 毎日 JST 13:17 に本番 DB へ書く(PC の 13:00 便と数日並走→差が無ければ PC の 2 段を止める)。
# 手で回すときは入力 apply が空= 取得と整形だけで件数を出す(本番 DB に書かない・読むのは可)。
# ⛔public repo: ID/PW・Cookie・頁の HTML・取得した中身をログ・artifact・cache に出さない。cache に入れるのは
#   done.tsv(日付・場の組・件数だけ)。頁と取得物は /tmp/kbdata(ジョブが終われば消える)。
# 台本 cloud/kb/ は PC の scraper の 9/29 版の写し。直したのは鍵(環境変数)と保存先(KB_DATA_DIR)だけ。
name: kb-daily

on:
  schedule:
    - cron: '17 4 * * *'   # JST 13:17
  workflow_dispatch:
    inputs:
      apply:
        description: '1= 本番 DB へ書く(nar_kb_runs・nar_jra_runs・nar_jra_horses・heartbeat)。空= 書かない'
        required: false
        default: ''
      works_dates:
        description: '南関の調教・談話を取り直す日(YYYYMMDD のカンマ区切り・空 = 今日と明日)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kb-daily
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  KB_DATA_DIR: /tmp/kbdata
  APPLY: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.apply }}
  PYTHONUNBUFFERED: '1'

jobs:
  # 2026-10-03 本命は本番 DB(pg_cron)の dispatch(inputs apply=1・JST 13:17)・GitHub の schedule は遅れて来る予備。
  #   予備の schedule で起きたとき、今日の成功(heartbeat 'jra_runs' の last_ok が JST 今日)があれば残りを飛ばして成功で終わる。
  #   表がまだ無い/読めないときは従来どおり走る(黙って止めない)。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            cloud/beat.py
            cloud/sb_gzip.py
          sparse-checkout-cone-mode: false
      - name: skip when today's run is already done
        id: g
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          S=0
          if [ "$EVENT" = "schedule" ]; then
            T=$(python3 cloud/beat.py --today jra_runs || echo '?')
            echo "jra_runs の今日の成功= $T(1= 済・0= 未・?= 読めない)"
            if [ "$T" = "1" ]; then S=1; echo "今日は済み= 予備の schedule は何もせず終わる"; fi
          fi
          echo "skip=$S" >> "$GITHUB_OUTPUT"

  kb:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3
      - name: unit tests
        run: python cloud/kb/test_push_kb_runs.py
      - name: dates
        run: |
          echo "W=$(date -d '7 days ago' +%Y%m%d)" >> "$GITHUB_ENV"
          echo "JST 今日= $(date +%Y%m%d)・馬具は $(date -d '7 days ago' +%Y%m%d) から・apply=[$APPLY]"
      # 2026-10-11 南関 4 場の調教(nar_kb_works)と厩舎の話(nar_kb_danwa)。それまでは PC のタスク(daily_update.py)だけが入れていて、
      #   PC が眠った 10/05〜08 は v3 の前日版が調教なし(束 t14・f10k が止まる)になった。v3 の 14:30 の便より前に入るよう最初に回す。
      - name: nankan works and danwa
        if: '!cancelled()'
        continue-on-error: true
        timeout-minutes: 20
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_RELAY_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}  # 競馬ブックが海外を断る間の東京の中継(cloud/kb/kb_relay.py)
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          IN_DATES: ${{ github.event.inputs.works_dates }}
        run: |
          D="${IN_DATES:-$(date +%Y%m%d),$(date -d tomorrow +%Y%m%d)}"
          echo "$D" | grep -Eq '^[0-9]{8}(,[0-9]{8})*$' || { echo "works_dates は YYYYMMDD のカンマ区切りで"; exit 1; }
          if [ "$APPLY" = "1" ]; then python cloud/kb/push_works.py --dates "$D" --push
          else python cloud/kb/push_works.py --dates "$D"; fi
      # 2026-11-09 厩舎の話の言い換え・札(nar_danwa_note)。原文は閲覧者に出さない(競馬ブックの許可は言い換えだけ)。
      #   失敗はスクリプトが heartbeat(job=danwa_para)に書いて exit 0。取得の便全体は赤にしない。
      - name: nankan danwa paraphrase and tags
        if: '!cancelled()'
        continue-on-error: true
        timeout-minutes: 20
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -q anthropic==2.8.0 || echo "anthropic が入らない= 札だけ入れる"
          python cloud/danwa/test_danwa_para.py
          if [ "$APPLY" = "1" ]; then python cloud/danwa/danwa_para.py
          else python cloud/danwa/danwa_para.py --dry-run; fi
      # 2026-11-12 寸評(過去の話と着順の答え合わせ+今回の話・nar_danwa_note の sunpyo* だけ)。cloud/danwa/sunpyo.py。
      #   言い換えの後(当日の para が要る)。落ちても exit 0・continue-on-error= 取得の便全体を赤にしない。
      - name: nankan danwa sunpyo
        if: '!cancelled()'
        continue-on-error: true
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python cloud/danwa/test_sunpyo.py
          if [ "$APPLY" = "1" ]; then python cloud/danwa/sunpyo.py
          else python cloud/danwa/sunpyo.py --dry-run --limit 5; fi
      # done.tsv(取得済みの印)だけを cache で持ち越す。無ければ 7 日分を全部取り直す(安全側)。
      - name: restore done marks
        uses: actions/cache/restore@v6
        with:
          path: /tmp/kbdata/kb_all/done.tsv
          key: kb-done-${{ github.run_id }}
          restore-keys: kb-done-
      - name: gear six tracks seiseki
        id: gearfetch
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_RELAY_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}  # 競馬ブックが海外を断る間の東京の中継(cloud/kb/kb_relay.py)
        run: python cloud/kb/fetch_kb_all.py --since "$W" --what seiseki --track 門別,大井,船橋,川崎,浦和,園田
      - name: gear counts
        if: '!cancelled()'
        run: python cloud/kb/kb_counts.py /tmp/kbdata/kb_all --since "$W"
      - name: gear push
        id: gearpush
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$APPLY" = "1" ]; then python cloud/kb/push_kb_runs.py --since "$W"
          else python cloud/kb/push_kb_runs.py --since "$W" --dry-run; fi
      # apply のときだけ done.tsv を残す(dry-run で「済み」にすると、次の apply がその日を飛ばして書かないため)
      # 11/3 監査: 取得か投入が落ちた回は残さない(残すと次の便がその日を飛ばし、6 場 1 日分が欠けたままになる)
      - name: save done marks
        if: env.APPLY == '1' && !cancelled() && steps.gearfetch.outcome == 'success' && steps.gearpush.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: /tmp/kbdata/kb_all/done.tsv
          key: kb-done-${{ github.run_id }}
      - name: jra runs
        if: '!cancelled()'
        env:
          KEIBABOOK_LOGIN_ID: ${{ secrets.KEIBABOOK_LOGIN_ID }}
          KEIBABOOK_PASSWORD: ${{ secrets.KEIBABOOK_PASSWORD }}
          KB_RELAY_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}  # 競馬ブックが海外を断る間の東京の中継(cloud/kb/kb_relay.py)
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          D="$(date +%Y%m%d),$(date -d tomorrow +%Y%m%d),$(date -d '2 days' +%Y%m%d)"
          if [ "$APPLY" = "1" ]; then python cloud/kb/fetch_jra_runs.py --dates "$D" --collect-cards --push
          else python cloud/kb/fetch_jra_runs.py --dates "$D" --collect-cards; fi
      # 中央在籍の戦数(nar_jra_horses.jra_career_runs)を未取得の馬から 300 頭(1 頭 3 秒待ち= 約 15 分)。落ちても便全体は落とさない。
      - name: jra career pending
        if: '!cancelled()'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$APPLY" = "1" ]; then python cloud/kb/fetch_jra_career.py --pending 300 --push
          else python cloud/kb/fetch_jra_career.py --pending 300; fi
