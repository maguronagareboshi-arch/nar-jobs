# B3 区切りの勝利(騎手だけ・2026-10-17)。公式の騎手個票から地方通算の勝ち数を読み、公開バケット cond-stats の v1/milestones.json へ上げる毎朝の便。
# 台本 cloud/milestones.py。出所= nar-site research/site-boost-20261017/b3-source.md。
# ⛔本番 DB では REST の単純 select だけ。書くのは Storage の cond-stats/v1/milestones.json だけ(DB に書かない)。
# ⛔個票は 1 本ずつ・1.5 秒あけて読む(約 270 人= 10 分弱)。
# 既定= 毎朝 JST 06:20(= UTC 21:20)。公式の個票は前日分まで入っている(10/17 実測)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: milestones
on:
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (no upload)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: milestones
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s tests -p "test_milestones.py"
      - name: milestones
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            python3 cloud/milestones.py --dry-run --out "$RUNNER_TEMP/ms"
            ls -l "$RUNNER_TEMP/ms"
          else
            python3 cloud/milestones.py --apply
            # 最終成功時刻(表 nar_job_heartbeat)。⛔表が無くても落ちない
            python3 cloud/beat.py milestones ok
          fi

      # 失敗の印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py milestones fail 失敗
