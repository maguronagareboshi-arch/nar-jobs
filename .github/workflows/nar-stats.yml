# 監査 A7(2026-09-24) 集計(場・人・組み合わせ・騎手×コース・AI成績・レース水準・重賞・高額配当)を
# 本番 DB ではなく Actions 内の Postgres で作り、差分だけ本番へ戻す便。台本は pipeline/stats_local/stats_local.py。
#   check= 手元で計算して本番の出力と突き合わせ、表ごとの 同じ/変わった/手元だけ/本番だけ をログに出す(⛔本番に書かない)
#   apply= 変わった行・新しい行を REST で upsert・本番だけの鍵を消す(安全柵に掛かれば何も書かない)。最後に heartbeat 'stats'
# ⛔成果物(artifact)を出さない(公開 repo)。⛔ログに秘密・入力の生データを出さない(台本は行数と見本の鍵だけ出す)。
name: nar-stats

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check= 照合だけ(本番に書かない) / apply= 差分を本番へ'
        type: choice
        options: [check, apply]
        default: check
      asof:
        description: 'check の時点合わせ(ISO 時刻・空= しない)。asof の後に入った行を外し、手元の current_date を asof の日にする'
        required: false
        default: ''
      allow_large:
        description: 'apply で 1 表の(変わった+消す)が 30% を超えても書く'
        type: boolean
        default: false
  workflow_call:
    inputs:
      mode:
        type: string
        default: check
  # 10/13: 夜にも 1 回(JST 22:15)= AI予想の成績・騎手などを「当日の確定分まで」にそろえる(朝 5:33 の回は nar-refresh の stats_check)。
  #   結果の取り込みは JST 21:37 の回が最後。schedule は inputs が無いので下の MODE で apply にする
  schedule:
    - cron: '15 13 * * *'

concurrency:
  group: nar-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'apply') || 'check' }}
      ASOF: ${{ github.event_name == 'workflow_dispatch' && inputs.asof || '' }}
      ALLOW_LARGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large && '1' || '' }}
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: stats            # ⛔このジョブの中だけの Postgres。鍵ではない
    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------- 器を立てる(本番と同じ PG17・ICU en-US・UTC)
      # asof があるときは手元の TimeZone をずらして current_date を「asof の UTC の日」(本番が計算した日・本番は TimeZone UTC)にそろえる。
      #   集計 SQL で TimeZone に左右されるのは current_date だけ(JST の日付は at time zone 'Asia/Tokyo' と明示・updated_at は比べない)。
      #   ⚠1 本目で試した libfaketime の器は立たなかった(2 分待っても応答なし)ので使わない。
      - name: start local postgres
        run: |
          set -u
          TZ_PG=UTC
          if [ -n "$ASOF" ] && [ "$MODE" = "check" ]; then
            TZ_PG=$(python3 -c 'import sys,datetime as d; u=d.timezone.utc; t=d.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); t=t if t.tzinfo else t.replace(tzinfo=u); D=t.astimezone(u).date(); n=d.datetime.now(u); o=[h for h in list(range(0,-13,-1))+list(range(1,15)) if (n+d.timedelta(hours=h)).date()==D]; o.sort(key=lambda h: abs((n+d.timedelta(hours=h)).hour-12)); print("UTC" if not o or o[0]==0 else "Etc/GMT%+d" % (-o[0]))' "$ASOF")
            echo "current_date を asof の日にそろえる TimeZone= $TZ_PG"
          fi
          docker run -d --name st --shm-size=2g -e POSTGRES_PASSWORD=stats             -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=en-US --locale=en_US.UTF-8"             -p 127.0.0.1:5432:5432 mirror.gcr.io/library/postgres:17             -c work_mem=256MB -c maintenance_work_mem=512MB -c shared_buffers=1GB -c max_wal_size=4GB             -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c timezone=$TZ_PG >/dev/null
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres -q; then echo "ready ($i)"; break; fi
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U postgres
          psql -X -At -c "select '時計 ' || now()::text || ' / current_date ' || current_date::text || ' / ' || version()"
          psql -X -At -c "select 'ロケール ' || datlocprovider::text || ' ' || coalesce(datlocale, '') || ' ' || datcollate from pg_database where datname = 'postgres'"
          df -h / | tail -n 1

      # ---------------------------------------------------------------- 11/6 送信量: 出力の照合元のキャッシュ(apply の便だけ・asof なし)
      #   前回成功した apply の後の手元の出力 16 表(=本番と同じ)を暗号化して置いておき、本番の出力を丸ごと読む(約 245MB/回)代わりに使う。
      #   ⛔公開 repo= 平文で置かない(暗号の鍵は secrets・fork の PR からは開けない)。前提= 16 表を書くのはこの便だけ。
      #   使えない(無い・印が dirty・本番の行数や最新の updated_at が合わない・7 日を超えた)ときは今までどおり丸ごと読む。
      - name: restore output cache
        if: env.MODE == 'apply' && env.ASOF == ''
        uses: actions/cache/restore@v6
        with:
          path: stats-out-cache.enc
          key: nar-stats-out-v1-none
          restore-keys: nar-stats-out-v1-

      # ---------------------------------------------------------------- ①④ 本番から写す(⛔読むだけ・1 表ずつ・statement_timeout 10min)
      - name: dump from production (read only)
        env:
          PROD_PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
          OUT_CACHE_PASS: ${{ secrets.NAR_DB_PASSWORD }}
        run: |
          set -u
          OC=""
          if [ "$MODE" = "apply" ] && [ -z "$ASOF" ] && [ -f stats-out-cache.enc ]; then
            mkdir -p out_cache
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:OUT_CACHE_PASS -in stats-out-cache.enc | tar -xzf - -C out_cache; then
              OC=out_cache
            else
              echo "キャッシュが開けない= 本番を丸ごと読む"; rm -rf out_cache
            fi
            rm -f stats-out-cache.enc
          fi
          python3 pipeline/stats_local/stats_local.py dump --asof "$ASOF" ${OC:+--out-cache "$OC"}

      # ---------------------------------------------------------------- ② 手元に入れる
      - name: load into local postgres
        run: python3 pipeline/stats_local/stats_local.py load

      # ---------------------------------------------------------------- ③ 集計 SQL 6 本をそのまま(⛔手元だけ)
      - name: run stats sql (local only)
        run: python3 pipeline/stats_local/stats_local.py run

      # ---------------------------------------------------------------- ③' §280 新馬戦の傾向(能検索引を行に開く → shinba_stats.sql・⛔手元だけ)
      - name: run shinba stats sql (local only)
        run: python3 pipeline/stats_local/stats_local.py shinba

      # ---------------------------------------------------------------- ③'' 10/2 馬主・生産者・調教師ページ(名寄せ → owner_breeder.sql・⛔手元だけ)
      - name: run owner breeder stats (local only)
        run: python3 pipeline/stats_local/stats_local.py ob

      # ---------------------------------------------------------------- ⑤ 照合(check)/ 差分を本番へ(apply)
      - name: diff against production
        if: env.MODE == 'check'
        run: python3 pipeline/stats_local/stats_local.py diff

      - name: apply diff to production
        if: env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/stats_local/stats_local.py apply ${ALLOW_LARGE:+--allow-large}

      - name: heartbeat ok
        if: success() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py stats ok
      - name: heartbeat fail
        if: failure() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py stats fail 失敗
      # §280 新馬戦の傾向(nar_shinba_stats)も同じ流れで書くので成否は同じ
      - name: heartbeat shinba ok
        if: success() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py shinba_stats ok
      - name: heartbeat shinba fail
        if: failure() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py shinba_stats fail 失敗
      # 10/2 馬主・生産者・調教師ページ(nar_name_alias / nar_person_year / nar_ob_*)も同じ流れで書くので成否は同じ
      - name: heartbeat owner breeder ok
        if: success() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py owner_breeder ok
      - name: heartbeat owner breeder fail
        if: failure() && env.MODE == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py owner_breeder fail 失敗

      # ---------------------------------------------------------------- 11/6 出力の照合元のキャッシュを置く(apply の便だけ・asof なし)
      #   成功= 手元の出力を写す / 失敗・取消(書きかけかもしれない)= 「使えない」印だけ置く= 次の便は本番を丸ごと読む
      - name: build output cache ok
        id: cache_ok
        if: success() && env.MODE == 'apply' && env.ASOF == ''
        continue-on-error: true
        env:
          OUT_CACHE_PASS: ${{ secrets.NAR_DB_PASSWORD }}
        run: |
          rm -f stats-out-cache.enc
          python3 pipeline/stats_local/stats_local.py save-cache out_cache
          tar -czf - -C out_cache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:OUT_CACHE_PASS -out stats-out-cache.enc
          ls -l stats-out-cache.enc
      - name: build output cache dirty
        if: always() && env.MODE == 'apply' && env.ASOF == '' && steps.cache_ok.outcome != 'success'
        env:
          OUT_CACHE_PASS: ${{ secrets.NAR_DB_PASSWORD }}
        run: |
          rm -f stats-out-cache.enc
          python3 pipeline/stats_local/stats_local.py dirty-cache out_cache
          tar -czf - -C out_cache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:OUT_CACHE_PASS -out stats-out-cache.enc
      - name: save output cache
        if: always() && env.MODE == 'apply' && env.ASOF == '' && hashFiles('stats-out-cache.enc') != ''
        uses: actions/cache/save@v6
        with:
          path: stats-out-cache.enc
          key: nar-stats-out-v1-${{ github.run_id }}-${{ github.run_attempt }}
