# 他場版 v3n(公式の元だけ・場ごとの AI を base-v1 と混ぜる・8 場)を書く便(2026-10-10・v3 の out/kochi_deploy_steps.md)。
# 2026-10-14 第 9 版(決め 31・v3 の out/v3n_one_u.md): 混ぜをやめて全国 1 本の固定の木(暗号化リリース v3n-one-20261014)。
# 2026-10-15 第 10 版(決め 32・v3 の out/v3n_2015_u.md): 同じ作りの木を材料表 2014〜・学び 2015-01〜で(v3n-one15-20261015)・並び読みも B15 の p5 で(v3n-seq-one15-20261015)。戻すときはリリース名を 20261014 の 2 つに・v3n_one_p5.json も一緒に戻す。
# 2026-10-25 第 11 版(決め 54・v3 の out/v3n_trees_judge.md): 木の本数を 3 着内 2 値 2550・順位 1140・勝ち 1040 本に(v3n-trees54-20261025)・並び読み(v3n-seq-trees54-20261025)・定数 v3-consts-20261028。戻すときはこの commit を revert(リリース名・定数が一緒に戻る)。
# 2026-10-31 第 12 版(決め 61・v3 の out/v3n_rb61_judge.md): 直近 2 年の木を 2 割混ぜ(v3n-rb61-20261031)+ 場 × 枠の群の前 56 日の内外の有利の直し・定数 v3-consts-20261031。戻すときはこの commit を revert。
#   材料 = nar-ai-feat の成果物の nar_ai_feat_run(base-v1 の朝の材料表)+ 公式の表から作る場の材料。並び読みの重みもイに合わせた版。
# 場 = 門別・水沢・金沢・笠松・名古屋・園田・高知・佐賀(v3 の out/nation.md で「入れ替えてよい」から南関を除く)。
# ⛔本番への書き込みは nar_ai_marks(model='v3n-1', timing='morning')の REST upsert だけ。SQL は流さない。
#   画面に出すかはサイト(nar-viewer)の AI_TAJO_PUBLIC で決める(v3 の out/v3n_site_spec.md)。それまでは見えない。
#   base-v1 の朝の行が無いレースは書かない= 2 回目の便(09:15)で埋まる。朝の行は凍結(上書きしない)。
# 読むのは nar-official の公開の表(nar_runs・nar_races・nar_run_facts・nar_horse_profiles・nar_jra_runs・nar_jra_horses)と
# nar-ai-feat の成果物(材料表)だけ。固定ファイル = 全国 1 本の木・並び読みの重み(暗号化リリース)。
name: nar-ai-v3n

on:
  workflow_dispatch:
    inputs:
      date:
        description: '予想する日(空= JST 今日)。例 2026-10-11'
        required: false
        default: ''
      write:
        description: '本番 nar_ai_marks(v3n-1・morning)に書く(yes/no)'
        required: false
        default: 'no'
  # 2026-10-11 1 回目 = base-v1 の朝の便(nar-ai-feat)が終わったらすぐ(GitHub の schedule の 07:15 は 10/11 に動かず・09:15 は 42 分遅れた)。
  #   ⛔nar-ai-feat が失敗・飛ばした便では動かない(下の jobs の if)。base-v1 の朝の行が無いレースは書かない = 2 回目で埋める
  workflow_run:
    workflows: [nar-ai-feat]
    types: [completed]
  schedule:
    - cron: '15 0 * * *'    # 09:15 JST の予備(1 回目に base-v1 の行が無くて書かなかったレースを埋める)

concurrency:
  # 2026-10-15 master 以外の枝の試しの便は別の列(本番の待ちを消さない・本番は今までどおり nar-ai-v3n)
  group: nar-ai-v3n${{ github.ref_name != 'master' && format('-{0}', github.ref_name) || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read               # nar-ai-feat の成果物(材料表)を取るため

jobs:
  # 2026-10-16 10/15・10/16 の実例: nar-ai-feat の予備 schedule(06:30 の予定が 08:46 ごろに遅れて走る)は gate が「今日は済み」で
  #   build を飛ばし成果物 0 本の success になる → それに起こされて「no valid artifacts」で毎朝 1 回落ちていた。
  #   nar-ai-v2 と同じく、起こした便に材料表の成果物が無ければ predict を飛ばす(行は本物の便で先に書き済み・残りは 09:15 の予備で埋める)
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - name: skip when the feat run has no artifacts
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EV_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$EV_ID" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EV_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("nar-ai-feat-") and (endswith("dumps") | not))] | length')
          echo "nar-ai-feat run=$EV_ID 材料表の成果物 $N 本"
          if [ "$N" -gt 0 ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nar-ai-feat run $EV_ID は build を飛ばした便(成果物 0)= 他場の朝の予想は作らない"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: check
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install python packages (手元と同じ版)
        run: pip install -q "pandas==2.2.3" "numpy==1.26.4" "pyarrow==25.0.1" "lightgbm==4.7.0" requests

      - name: day
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            echo "$IN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "date は YYYY-MM-DD で"; exit 1; }
            DAY="$IN_DATE"
          else
            DAY=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "day=$DAY"

      # 2026-10-14 第 9 版: base-v1 の朝の材料表 = nar-ai-feat の成果物。1 回目(workflow_run)はその便、09:15 の予備・手動は成果物のある最新の成功便。
      #   ⛔材料表に無いレースは v3n_daily が書かない(落ちない)。取れなければこの段で落ちる(何も書かない)
      - name: fetch base-v1 features (nar-ai-feat artifact)
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          RUN_FROM: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          ID="$RUN_FROM"
          if [ -z "$ID" ]; then
            for L in $(gh run list -R "$GITHUB_REPOSITORY" -w nar-ai-feat.yml -s success -L 10 --json databaseId --jq '.[].databaseId'); do
              N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$L/artifacts" --jq '[.artifacts[] | select(.name | startswith("nar-ai-feat-") and (endswith("dumps") | not))] | length')
              if [ "$N" -gt 0 ]; then ID=$L; break; fi
              echo "run $L は材料表の成果物 0 本= 飛ばす"
            done
          fi
          [ -n "$ID" ] || { echo "nar-ai-feat の成功便が見つからない"; exit 1; }
          gh run view "$ID" -R "$GITHUB_REPOSITORY" --json createdAt,event --jq '"nar-ai-feat run '"$ID"' \(.event) \(.createdAt)"'
          gh run download "$ID" -R "$GITHUB_REPOSITORY" -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("nar-ai-feat-") and (endswith("dumps") | not))][0].name')" -D featdl
          bash ops/artifact_seal.sh unseal featdl
          F=$(find featdl -name 'nar_ai_feat_run.csv*' | head -n 1)
          [ -n "$F" ] || { echo "nar_ai_feat_run が無い"; exit 1; }
          mkdir -p feat
          case "$F" in *.gz) mv "$F" feat/nar_ai_feat_run.csv.gz ;; *) gzip -c "$F" > feat/nar_ai_feat_run.csv.gz ;; esac
          rm -rf featdl
          ls -l feat

      # 2026-10-14 第 9 版 = 全国 1 本の固定の木(v3 の src/f5_scripts/v3n_one_prod.py tree・2026-09-01 切り)。⛔無ければ v3n_daily が落ちる(何も書かない)
      - name: download v3n one model
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3n-trees54-20261025 -p 'v3n_one.tar.gz.enc' -D in
          mkdir -p v3n_one
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3n_one.tar.gz.enc | tar -C v3n_one -xzf -
          rm -f in/v3n_one.tar.gz.enc
          ls -l v3n_one

      # 2026-10-31 第 12 版(決め 61・v3 の out/v3n_rb61_judge.md)= 2 本目の木(直近 2 年・v3 の src/f5_scripts/v3n_rb61_prod.py tree・2026-09-01 切り)。⛔無ければ v3n_daily が落ちる(何も書かない)
      - name: download v3n rb61 model
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3n-rb61-20261031 -p 'v3n_rb61.tar.gz.enc' -D in
          mkdir -p v3n_rb61
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3n_rb61.tar.gz.enc | tar -C v3n_rb61 -xzf -
          rm -f in/v3n_rb61.tar.gz.enc
          ls -l v3n_rb61

      # 2026-10-12 第 6 版 = 並び読み(14 場 + 中央の過去 10 走・v3 の out/v3n_seq.md)の固定ファイル(時計のならし・重み 3 本)。
      #   2026-10-14 第 9 版: 重みをイの p5 で仕上げ直した版(v3n-seq-one-20261014)。戻すときは v3n-seq-20261012 と v3n_daily の第 8 版を一緒に。
      #   無ければ v3n_daily は並び読みを足さずに書く
      - name: download v3n seq files
        continue-on-error: true
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          gh release download v3n-seq-trees54-20261025 -p 'v3n_seq.tar.gz.enc' -D in
          mkdir -p v3n_seq
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3n_seq.tar.gz.enc | tar -C v3n_seq -xzf -
          rm -f in/v3n_seq.tar.gz.enc
          ls -l v3n_seq

      # 2026-10-15 予想の学んだ定数・表(勝つ率の直し・談話の印・他場の曲線など)= 暗号化したリリース v3-consts-20261031(公開のコードに置かない)。
      #   取れない・開けない・中身が欠けている時は止める(黙って別の値で予想を出さない)。中身の確かめ = pipeline/ai/sealed.py check
      - name: download sealed constants
        id: sc
        env:
          V3_ASSET_KEY: ${{ secrets.V3_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          V3_ASSET_KEY=$(printf %s "$V3_ASSET_KEY" | tr -d '\r\n'); export V3_ASSET_KEY
          : "${V3_ASSET_KEY:?secrets.V3_ASSET_KEY が無い}"
          mkdir -p in sealed_consts
          for i in 1 2 3; do
            gh release download v3-consts-20261031 -p 'v3_consts.tar.gz.enc' -D in --clobber && break
            [ "$i" = 3 ] && { echo "::error::⛔ 予想の定数(v3-consts-20261031)を 3 回取れなかった"; exit 1; }
            sleep 20
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:V3_ASSET_KEY -in in/v3_consts.tar.gz.enc | tar -C sealed_consts -xzf -
          rm -f in/v3_consts.tar.gz.enc
          V3_CONSTS="$PWD/sealed_consts" python -X utf8 pipeline/ai/sealed.py check
          echo "V3_CONSTS=$PWD/sealed_consts" >> "$GITHUB_ENV"

      - name: v3n 10 tracks (fetch → features → one model → write)
        env:
          V3N_SEQ: v3n_seq
          V3N_ONE: v3n_one
          V3N_RB61: v3n_rb61
          V3N_FEAT: feat/nar_ai_feat_run.csv.gz
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'yes' || github.event.inputs.write }}
          NAR_JOBS_AI: pipeline/ai
        run: |
          set -o pipefail
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          echo "day=${{ steps.d.outputs.day }} write=$WRITE"
          python -X utf8 -W ignore pipeline/ai/kochi/v3n_daily.py "${{ steps.d.outputs.day }}" work $W 2>&1 | tee out_log.txt
          df -h / | tail -n 1
