# §89 公表された疾病・競走事故履歴。JST 10時台に直近7日を自己修復する。
# 2026-09-08 nar-viewer(private)から nar-jobs(public)へ移設(#529)。
# 手動はNAR/既存auction原本を選べる。dry-runで期間を検品し、forceは確認済みsource 1件だけ。
name: horse-health

on:
  schedule:
    - cron: '43 1 * * *'       # JST 10:43（PDFは翌09:30台の公開を実測。GitHub cronはUTC）
  workflow_dispatch:
    inputs:
      source:
        description: '対象（auctionは既存原本だけを全履歴走査・再クロールなし）'
        required: true
        default: nar
        type: choice
        options: [nar, auction, all]
      start:
        description: '開始日（空ならnar=直近7日、auction=2026年全件、all=両方）'
        required: false
        type: string
      end:
        description: '終了日 YYYY-MM-DD（空なら昨日）'
        required: false
        type: string
      dry_run:
        description: '履歴行へ書かず解析件数だけ確認（DDL bootstrapは実行）'
        required: true
        default: true
        type: boolean
      force_review_ref:
        description: '確認済みsource_ref 1件だけ強制採用（例 20260902/27）'
        required: false
        type: string
      reparse:
        description: 'parser版更新後の過去sourceを明示再解析（先にdry-run）'
        required: true
        default: false
        type: boolean
      allow_fewer:
        description: '§124 parser更新で事象が減るsourceも通す（reparseと一緒に・1回だけ）'
        required: false
        default: false
        type: boolean

concurrency:
  # GitHubは同一groupのpendingを1件しか保持しない。月別backfillは必ず前run完了後に次月をdispatchする。
  group: horse-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 監査 A2(2026-09-24): 本命は本番 DB(pg_cron)の dispatch・GitHub の schedule は予備として残す。
  #   予備の schedule で起きたとき、今日の成功(heartbeat 'horse_health' の last_ok が JST 今日)があれば残りを飛ばして成功で終わる。
  #   表がまだ無い/読めないときは従来どおり走る。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud/beat.py
          sparse-checkout-cone-mode: false
      - name: skip when today's run is already done
        id: g
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          S=0
          if [ "$EVENT" = "schedule" ]; then
            T=$(python3 cloud/beat.py --today horse_health || echo '?')
            echo "horse_health の今日の成功= $T(1= 済・0= 未・?= 読めない)"
            if [ "$T" = "1" ]; then S=1; echo "今日は済み= 予備の schedule は何もせず終わる"; fi
          fi
          echo "skip=$S" >> "$GITHUB_OUTPUT"

  import:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    # 通常7日分は短時間。初回2026年NARを月単位dispatchしても途中打切りにしない安全幅。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 初回workflow_dispatchだけでもbootstrapできるよう、冪等DDLを収集より先に毎回確認する。
      - name: migrate horse health schema
        env:
          PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -o pipefail
          # 監査 A10(2026-09-24) 先に「もう望む形か」を読むだけで確かめ、そうなら下の DDL(drop/add constraint= 表を排他ロック+全件検証)を飛ばす。
          #   足りない項目が 1 つでも出たら・確認が読めなかったら、従来どおり全部流す(= 表の形は今と同じに収まる)。
          MISS=$(psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres \
            -v ON_ERROR_STOP=1 -X -At -c "set statement_timeout = '60s'" -f pipeline/sql/health_schema_shape_check.sql) || MISS="(確認が読めなかった)"
          MISS=$(printf '%s\n' "$MISS" | grep -v '^SET$' || true)
          if [ -z "$MISS" ]; then echo "健康の器はもう望む形= DDL を飛ばす"; exit 0; fi
          echo "望む形でない= DDL を流す:"; printf '%s\n' "$MISS"
          psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 \
            -U postgres.qgsnsdjvzzeazbazjlwa -d postgres \
            -v ON_ERROR_STOP=1 -X -f pipeline/sql/horse_health_20260903.sql
          # §92/§109 主催者公式の器(Codex が 9/4・9/5 に適用済み)。§109 は source_kind='<slug>_official' でこの器へ入れる。
          # ⛔20260904 の SQL は流さない= 4 主催者だけの古い allowlist を書き戻し、kochi_official の行があると制約で落ちる
          #   (2026-09-05 run 33962513805 で実測)。20260905(全主催者)だけが冪等。
          psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 \
            -U postgres.qgsnsdjvzzeazbazjlwa -d postgres \
            -v ON_ERROR_STOP=1 -X -f pipeline/sql/horse_health_all_organizers_20260905.sql
          # #528 制裁の読み済み記録(PDF の sha256+読み手の版)。冪等
          psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 \
            -U postgres.qgsnsdjvzzeazbazjlwa -d postgres \
            -v ON_ERROR_STOP=1 -X -f pipeline/sql/penalties_sources_20260908.sql
          # §193c オークションの分類 v2(CHECK 17 値・印 2 列・書く関数 v2)。⛔20260903 が公開の関数を古い本体で作り直すので毎回この後に流す。冪等
          psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres -v ON_ERROR_STOP=1 -X -f pipeline/sql/auction_groups_v2_20260916.sql | tail -n 3
      - name: install health dependencies
        run: pip install -r cloud/requirements.txt

      - name: import health events
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          INPUT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'nar' }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INPUT_FORCE_REVIEW_REF: ${{ inputs.force_review_ref }}
          INPUT_REPARSE: ${{ github.event_name == 'workflow_dispatch' && inputs.reparse || false }}
          INPUT_ALLOW_FEWER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_fewer || false }}
        run: |
          args=(--source "$INPUT_SOURCE")
          if [ -n "$INPUT_START" ]; then args+=(--start "$INPUT_START"); fi
          if [ -n "$INPUT_END" ]; then args+=(--end "$INPUT_END"); fi
          if [ -n "$INPUT_FORCE_REVIEW_REF" ]; then args+=(--force-review-ref "$INPUT_FORCE_REVIEW_REF"); fi
          if [ "$INPUT_REPARSE" = "true" ]; then args+=(--reparse); fi
          if [ "$INPUT_ALLOW_FEWER" = "true" ]; then args+=(--allow-fewer); fi
          if [ "$INPUT_DRY_RUN" != "true" ]; then args+=(--apply); fi
          python cloud/horse_health.py "${args[@]}" --report-json horse-health-report.json
      - name: upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horse-health-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: horse-health-report.json
          if-no-files-found: ignore
          retention-days: 30

      # §109 主催者公式の「出来事」。⛔上の段(NAR/オークション)とは独立=落ちても走る。
      #   既定の窓は直近14日・冪等(event_id が同じなら上書き)。読めない文書は数えるだけで止めない。
      - name: organizer kochi (daily)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/health_org.py --adapter kochi --apply
      # §110 大井・佐賀(RSS 本文)。⛔上の段とは独立=落ちても走る。NAR 成績 PDF と同じ出来事は画面側で NAR を残す(#483 ③)
      - name: organizer ooi (daily)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/health_org.py --adapter ooi --apply
      - name: organizer saga (daily)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/health_org.py --adapter saga --apply

      # §111 制裁(戒告・過怠金・騎乗停止)。⛔上の段とは独立=落ちても走る。
      #   既定の窓は直近14日・冪等(penalty_id が同じなら上書き)。読めない行は数えるだけで止めない。
      - name: penalties (daily)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/penalties.py --apply

      # 監査 A8(2026-09-24) 最終成功時刻(表 nar_job_heartbeat 'horse_health')。dry_run の便は書かない。⛔表が無くても落ちない
      - name: heartbeat
        if: '!cancelled()'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          OK: ${{ job.status == 'success' && 'ok' || 'fail' }}
        run: |
          if [ "$DRY" = "true" ]; then echo "dry_run= heartbeat は書かない"; exit 0; fi
          if [ "$OK" = "ok" ]; then python3 cloud/beat.py horse_health ok; else python3 cloud/beat.py horse_health fail 失敗; fi
