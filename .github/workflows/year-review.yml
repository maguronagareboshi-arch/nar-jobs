# 「<年> 年の地方競馬」まとめ(2026-10-27)。台本 cloud/year_review.py が cond-stats/v1/year-review-<年>.json を上げる(画面 nar-viewer /year/<年>)。
# ⛔本番 DB では REST の単純 select だけ。年= 集計日(JST の前日)の年(1/1 は前年のまま作る)。1 着が 0 件なら上げない(前の版を残す)。
# 既定= 毎朝 JST 06:10(= UTC 21:10)。heartbeat と見張りの鍵 year_review。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: year-review
on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: year-review
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: year review
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/year_review.py --apply
          python3 cloud/beat.py year_review ok
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py year_review fail 失敗
