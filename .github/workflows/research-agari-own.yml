# 研究用・1 回きり。上がりの差を「いつもとの差」に変えた物差し(cloud/research_agari_own.py)を高知 2025-10-01〜2026-10-11 で集計し docs/research-agari-own/result.md を書く。
# ⛔本番 DB では REST の単純 select だけ。集計は全部 Python。書き込みなし。
name: research-agari-own
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-agari-own
  cancel-in-progress: false
jobs:
  agari:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: agari own baseline
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: |
          python3 cloud/research_agari_own.py
          if [ -n "$(git status --porcelain docs/research-agari-own)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/research-agari-own
            git commit -m "上がりのいつもとの差 研究集計 $(TZ=Asia/Tokyo date +%F)"
            for i in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
          else
            echo "差分なし"
          fi
