# 2026-11-07 走破指数を他 10 場へ(cloud/si_all.py)の埋め直し便。照合(check3)と同じ作り= 14 場を 1 回読み、書くのは対象の場だけ。
# 場ごと・月ごとに順に nar_si5 へ upsert(トリガーで nar_runs.si5 へ写る)。範囲は年か月(1 回で 1〜数年)。
# ⛔南関 4 場(si5_store が書く)と帯広ばは台本が弾く。apply=no は計算と行数だけ(書かない)。同時に走るのは 1 本。
# 読む量= 14 場×(対象の年の 3 年前の 1 月〜終わり)。1 年ぶんで走 約 55 万行・約 120MB(JSON)・所要 約 5 分(見込みはログの頭)。
name: si-all-backfill
on:
  workflow_dispatch:
    inputs:
      track:
        description: '場(all= 10 場ぜんぶ)'
        required: true
        default: 'all'
        type: choice
        options: [all, 門別, 盛岡, 水沢, 金沢, 笠松, 名古屋, 園田, 姫路, 高知, 佐賀]
      from:
        description: '始め YYYY か YYYY-MM'
        required: true
      to:
        description: '終わり YYYY か YYYY-MM'
        required: true
      apply:
        description: 'nar_si5 へ書く(yes/no)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
concurrency:
  group: si-all-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==1.26.4
      - name: check inputs
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          echo "$FROM" | grep -Eq '^20[0-9]{2}(-(0[1-9]|1[0-2]))?$' || { echo "from は YYYY か YYYY-MM"; exit 1; }
          echo "$TO" | grep -Eq '^20[0-9]{2}(-(0[1-9]|1[0-2]))?$' || { echo "to は YYYY か YYYY-MM"; exit 1; }
          [ "$FROM" \< "$TO" ] || [ "$FROM" = "$TO" ] || { echo "from が to より後"; exit 1; }
      - name: si all backfill
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          TRACK: ${{ inputs.track }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "yes" ]; then A=--apply; else A=; fi
          if [ "$TRACK" = "all" ]; then T=; else T="--track $TRACK"; fi
          python -X utf8 cloud/si_all.py run $T --from "$FROM" --to "$TO" $A
