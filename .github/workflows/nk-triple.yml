name: nk-triple
# 2026-11-18 南関のトリプル馬単の買い目(その日の最終 3 レースの馬単・200 枚 = 1 万円まで)を書き直す小さな便。
#   買い目そのものは前日の便 nar-ai-v3 の中で作る(pipeline/ai/v3/triple_live.py)。この便は「持ち越し」を確かめ直すためにある:
#   南関は同じ場で 5 日続くので、前日 15 時には前の開催日(= その日の夜)の結果がまだ無い。夜と当日の朝・昼にもう一度作って置く。
#   前日版の印の行(nar_ai_marks・v3-9・morning)を読み、公開バケット cond-stats/triple/v1/<日>.json へ置くだけ。
#   ⛔予想の印・率は書かない。オッズは使わない。投票はしない。開催の無い日は何も置かずに緑で終わる。
on:
  schedule:
    - cron: '40 13 * * *'   # 22:40 JST = 明日の分(今日の最終レースの結果が出た後)
    - cron: '30 23 * * *'   # 08:30 JST = 今日の分
    - cron: '0 3 * * *'     # 12:00 JST = 今日の分(朝が遅れた・落ちたときの控え)
  workflow_dispatch:
    inputs:
      day:
        description: '作る日(YYYY-MM-DD・空 = 14 時より前は今日、後は明日)'
        required: false
        default: ''
      write:
        description: 'yes = 公開バケットへ置く / no = 作るだけ(記録で確かめる)'
        required: false
        default: 'no'

concurrency:
  group: nk-triple${{ github.ref_name != 'master' && format('-{0}', github.ref_name) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  triple:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/ai-code/
            ops/ai_ref.txt
            pipeline/ai/v3/triple_live.py
            cloud/jp_fetch.py
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ai-code
        with:
          key: ${{ secrets.V3_AI_DEPLOY_KEY }}
          mode: fallback
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install python packages (前日の便と同じ版)
        run: pip install -q "numpy==1.26.4"
      - name: day
        id: d
        env:
          IN_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$IN_DAY" ]; then
            echo "$IN_DAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::day の形が違う: $IN_DAY"; exit 1; }
            DAY="$IN_DAY"
          elif [ "$(TZ=Asia/Tokyo date +%H)" -lt 14 ]; then
            DAY=$(TZ=Asia/Tokyo date +%F)
          else
            DAY=$(TZ=Asia/Tokyo date -d tomorrow +%F)
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "day=$DAY"
      - name: triple umatan picks (public bucket)
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event_name == 'schedule' && 'yes' || github.event.inputs.write }}
        run: |
          set -o pipefail
          if [ "$WRITE" = "yes" ]; then W=--write; else W=; fi
          python -X utf8 pipeline/ai/v3/triple_live.py "${{ steps.d.outputs.day }}" --out out_triple $W
          if [ -z "$W" ]; then find out_triple -name '*.json' -exec cat {} \; ; fi
