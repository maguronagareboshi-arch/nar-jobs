# 2026-11-11 持ち出し止めの見回り。毎時 07 分に直前 1 時間の通信記録を数え、1 時間 5,000 回以上の IP を
# 出入り禁止名簿(private.nar_block_ip)へ載せる。中身は cloud/ip_block.py。
# 定期の実行は当面 DRY_RUN= 表を出すだけ(ユーザー了承後に '0' へ)。
name: nar-ip-block

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 見る時間(1〜24)
        default: '1'
      dry_run:
        description: 1= 名簿に書かない
        default: '1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: scan logs and update block list
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOURS: ${{ inputs.hours || '1' }}
          DRY_RUN: ${{ inputs.dry_run || '1' }}
        run: python3 cloud/ip_block.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: heartbeat
        if: '!cancelled() && github.event_name == ''schedule'''
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          OK: ${{ job.status == 'success' && 'ok' || 'fail' }}
        run: python3 cloud/beat.py ip_block "$OK" "見回り"
