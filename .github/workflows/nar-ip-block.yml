# 2026-11-11 持ち出し止めの見回り。毎時 07 分に直前 1 時間の通信記録を数え、1 時間 5,000 回以上の IP を
# 出入り禁止名簿(private.nar_block_ip)へ載せる。中身は cloud/ip_block.py。
# 11/11 ユーザー了承で定期の実行は名簿に書く(DRY_RUN '0')。
name: nar-ip-block

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 見る時間(1〜24)
        default: '1'
      dry_run:
        description: 1= 名簿に書かない
        default: '1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: scan logs and update block list
        id: s
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOURS: ${{ inputs.hours || '1' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          DC_DRY: '1'   # 借りたコンピューターの線(300/時)は数日 表だけ。了承後に '0'
        run: python3 cloud/ip_block.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: heartbeat
        if: '!cancelled() && github.event_name == ''schedule'''
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          OK: ${{ job.status == 'success' && 'ok' || 'fail' }}
        run: python3 cloud/beat.py ip_block "$OK" "見回り"
      # 名簿に載せたら 1 日 1 通= その日最初の 1 回だけ赤にする(赤= 所有者へ GitHub のメール)
      - name: notify once a day
        if: steps.s.outputs.listed != '' && steps.s.outputs.listed != '0' && github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
          IPS: ${{ steps.s.outputs.ips }}
        run: |
          if [ "$(python3 cloud/beat.py --today ip_block_notice)" = "1" ]; then echo "今日は知らせ済み $IPS"; exit 0; fi
          python3 cloud/beat.py ip_block_notice ok "$IPS"
          echo "::error::出入り禁止名簿に載せた(知らせだけ・便は正常) $IPS"
          exit 1
