# §移籍まとめ D2(2026-09-30)公式 keiba.go.jp の「現役管理馬一覧」を調教師ごとに毎晩取る便(cloud/trainer_roster.py)。
#   表 nar_trainers・nar_trainer_roster(形は sql/trainer_roster.sql・⛔適用前に動かすと apply が落ちる)。
#   ① probe= 走者から keiba.go.jp が取れるか 1 人だけ試す(persons.yml は同じ DataRoom を走者から取れている)。
#      取れなければ ::warning:: と heartbeat fail で止める(pg_net 案に切り替える前に本体へ報告)
#   ② apply= 地方の現役 約 460 人を 2 秒間隔で取る(約 20 分)→ upsert → 一覧から消えた馬の行を消す
#      → rpc nar_trainers_match_short(略称の確定)→ heartbeat 'trainer_roster'(note に 人数・頭数・失敗・略称)。
#   ⛔便を足したら viewer の /update-times にも行を足す(nar-viewer 側)。
# 必要な Secrets: NAR_SUPABASE_URL / NAR_SUPABASE_SERVICE_KEY
name: trainer-roster
on:
  schedule:
    - cron: '20 17 * * *'    # JST 02:20(夜間・1 日 1 回)
  workflow_dispatch:
concurrency:
  group: trainer-roster
  cancel-in-progress: false
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ① 走者から取れるかの試し(DB は読まない・書かない)
      - name: probe runner fetch
        id: probe
        run: |
          if python cloud/trainer_roster.py --probe; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::走者から keiba.go.jp の調教師の頁を取れない= 本体へ報告(pg_net 案は了承後)"
          fi

      - name: trainer roster apply
        if: steps.probe.outputs.ok == '1'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/trainer_roster.py --apply --out "$RUNNER_TEMP/roster.csv"

      - name: heartbeat probe fail
        if: steps.probe.outputs.ok == '0'
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py trainer_roster fail 走者から取れない

      # 想定外で落ちたときの印(表 nar_job_heartbeat)。⛔表が無くても落ちない
      - name: heartbeat fail
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python3 cloud/beat.py trainer_roster fail 便が落ちた
