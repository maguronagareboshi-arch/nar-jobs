# 一時(照合用): 東海の台帳を書き出して artifact に置く(書き込みなし)。照合が済んだら元の trace に戻す
name: tokai-trace
on:
  workflow_dispatch:
    inputs:
      horse:
        description: 馬名(カンマ区切りで複数可)
        required: true
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - name: dump
        env:
          SUPABASE_URL: ${{ secrets.NAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.NAR_SUPABASE_SERVICE_KEY }}
        run: python cloud/ks_dump.py 2>&1 | grep -a "^DUMP"
      - uses: actions/upload-artifact@v7
        with:
          name: tokai-dump
          path: tokai_dump.json.gz
          retention-days: 1
