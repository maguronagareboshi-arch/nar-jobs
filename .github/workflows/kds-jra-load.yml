# 案件 F(2026-10-04)の一回便= KDSCOPE の中央戦績を nar_jra_horses / nar_jra_runs に足す。⛔手で回すだけ(cron なし)。
# CSV は nar-site\research\kdscope-ideas\efg\f_prep.py で作る。済んだらこの便と CSV は消す。
# stage= count(馬と走の最初の 5 万行を入れて巻き戻す)/ horses(馬を書く)/ runs(走を 5 万行ずつ書く・毎回 DB の大きさを測り 5200MB 超で止める)
name: kds-jra-load

on:
  workflow_dispatch:
    inputs:
      stage:
        description: count か horses か runs
        required: true
        type: string
        default: count
      confirm:
        description: 本番へ書くときだけ apply と打つ(それ以外は巻き戻す)
        required: false
        type: string
        default: ''

concurrency:
  group: kds-jra-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: unpack and split csv
        run: |
          gunzip -c pipeline/kds_jra/h.csv.gz > /tmp/h.csv
          gunzip -c pipeline/kds_jra/r.csv.gz > /tmp/rall.csv
          head -1 /tmp/rall.csv > /tmp/rhead.csv
          tail -n +2 /tmp/rall.csv | split -l 50000 -d - /tmp/rpart_
          wc -l /tmp/h.csv /tmp/rall.csv /tmp/rpart_*
      - name: load
        env:
          PGPASSWORD: ${{ secrets.NAR_DB_PASSWORD }}
          PGSSLMODE: require
          IN_CONFIRM: ${{ inputs.confirm }}
          IN_STAGE: ${{ inputs.stage }}
        run: |
          set -eo pipefail
          APPLY=false; if [ "$IN_CONFIRM" = "apply" ]; then APPLY=true; fi
          echo "stage=$IN_STAGE apply=$APPLY"
          P() { psql -h aws-0-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.qgsnsdjvzzeazbazjlwa -d postgres -X "$@" -f pipeline/kds_jra/load.sql; }
          case "$IN_STAGE" in
            count)
              cat /tmp/rhead.csv /tmp/rpart_00 > /tmp/r.csv
              P -v do_h=true -v do_r=true -v apply=false ;;
            horses)
              P -v do_h=true -v do_r=false -v apply=$APPLY ;;
            runs)
              for f in /tmp/rpart_*; do
                echo "== $f"
                cat /tmp/rhead.csv "$f" > /tmp/r.csv
                P -v do_h=false -v do_r=true -v apply=$APPLY
              done ;;
            *) echo "stage が違う"; exit 2 ;;
          esac
